<title>🎮 شکار کسرهای مساوی + شبکه‌های اجتماعی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== استایل‌های بازی (دقیقاً از فایل اصلی) ===== */
body{margin:0;font-family:'Vazirmatn',sans-serif;background:linear-gradient(#e3f2fd,#ffffff);height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;}
#menu{background:#ffffff;width:90%;max-width:500px;padding:30px;border-radius:20px;box-shadow:0 8px 20px rgba(0,0,0,0.15);text-align:center;}
h1{margin-bottom:10px;color:#1565c0;font-size:28px;}
#guide{background:#f5f7fa;padding:15px;border-radius:12px;font-size:16px;line-height:1.8;margin:20px 0;}
button{width:100%;padding:14px;margin:10px 0;font-size:18px;border:none;border-radius:14px;cursor:pointer;font-family:'Vazirmatn';}
.easy{background:#4caf50;color:white;}
.hard{background:#f44336;color:white;}
#game{display:none;position:absolute;inset:0;padding:12px;}
#topBar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px;}
.box{background:white;padding:10px 8px;border-radius:14px;text-align:center;font-size:16px;box-shadow:0 4px 10px rgba(0,0,0,0.15);}
@keyframes fall{from{top:-90px;}to{top:100vh;}}
.fraction{position:absolute;background:#bbdefb;width:80px;height:80px;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:22px;cursor:pointer;animation-name:fall;animation-timing-function:linear;}
#changeOverlay{position:fixed;inset:0;background: rgba(255, 235, 59, 0.5);color: #000;font-size: 36px;font-family:'Vazirmatn';display:flex;justify-content:center;align-items:center;font-weight:bold;text-align:center;opacity:0;pointer-events:none;transition:opacity 0.3s ease;z-index:9999;white-space:nowrap;}
@keyframes heartBreak{0%{transform:translateY(0);opacity:1;}100%{transform:translateY(-50px);opacity:0;}}
.heartAnim{position:absolute;font-size:24px;animation:heartBreak 1s forwards;pointer-events:none;z-index:10000;}
#endGameOverlay{position:fixed;inset:0;background: rgba(0,0,0,0.7);display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff;font-family:'Vazirmatn';font-size:22px;z-index:10000;display:none;}
#endGameOverlay button{margin:10px;padding:12px 20px;font-size:18px;border:none;border-radius:12px;cursor:pointer;background:#4caf50;color:white;}
#endGameOverlay button#homeBtn{background:#2196f3;}

/* استایل کسر افقی */
.frac-horizontal {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.2;
    vertical-align: middle;
}
.frac-num {
    font-size: 0.9em;
    font-weight: bold;
}
.frac-bar {
    width: 100%;
    height: 2px;
    background: #333;
    margin: 2px 0;
    border-radius: 1px;
}
.frac-den {
    font-size: 0.9em;
    font-weight: bold;
}

/* ===== استایل‌های منوی شبکه‌های اجتماعی (اصلاح‌شده) ===== */
:root {
  --neon-primary: #0ff;
  --neon-secondary: #f0f;
  --bg-dark: #121212;
}

.circular-menu {
  position: fixed;
  bottom: 25px;
  left: 25px;
  width: 60px;
  height: 60px;
  z-index: 9999;
  pointer-events: none; /* اجازه عبور رویدادها به لایه‌های پایین‌تر */
}
.circular-menu * {
  pointer-events: auto; /* فقط خود منو قابل کلیک باشد */
}

.circular-menu .menu-button {
  position: absolute;
  top: 0; left: 0;
  width: 58px; height: 58px;
  border-radius: 50%;
  background-color: var(--bg-dark);
  color: var(--neon-primary);
  border: 2px solid var(--neon-primary);
  cursor: pointer;
  z-index: 2;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 0 8px var(--neon-primary),
              0 0 15px var(--neon-primary),
              0 0 30px var(--neon-primary),
              inset 0 0 15px rgba(0, 255, 255, 0.2);
  transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
  -webkit-tap-highlight-color: transparent;
}

.circular-menu .menu-button:focus-visible {
  outline: 3px solid #fff;
  outline-offset: 3px;
}

.circular-menu.active .menu-button {
  background-color: #1a0a1a;
  color: var(--neon-secondary);
  border-color: var(--neon-secondary);
  transform: rotate(135deg);
  box-shadow: 0 0 10px var(--neon-secondary),
              0 0 20px var(--neon-secondary),
              0 0 40px var(--neon-secondary),
              inset 0 0 20px rgba(255, 0, 255, 0.3);
}

.circular-menu .menu-item {
  position: absolute;
  top: 0; left: 0;
  width: 52px; height: 52px;
  border-radius: 50%;
  background-color: #ffffff;
  color: #2c3e50;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  transform: scale(0);
  z-index: -1;
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
  pointer-events: none;
  visibility: hidden;
  transition: all 0.3s ease;
}

.circular-menu.active .menu-item {
  pointer-events: auto;
  visibility: visible;
}

.menu-item:focus-visible {
  outline: 3px solid #fff;
  outline-offset: 2px;
}

.menu-item.instagram:hover, .menu-item.instagram:focus-visible { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: white; }
.menu-item.telegram:hover, .menu-item.telegram:focus-visible { background: #0088cc; color: white; }
.menu-item.aparat:hover, .menu-item.aparat:focus-visible { background: #ed1c24; color: white; }
.menu-item.website:hover, .menu-item.website:focus-visible { background: #4facfe; color: white; }
.menu-item.webapp:hover, .menu-item.webapp:focus-visible { background: #6c5ce7; color: white; }

.circular-menu.ready.active .menu-item {
  animation-duration: 0.45s;
  animation-timing-function: cubic-bezier(0.68, -0.55, 0.27, 1.55);
  animation-fill-mode: forwards;
}
.circular-menu.ready.active .menu-item:nth-child(1) { animation-name: expand1; animation-delay: 0.00s; }
.circular-menu.ready.active .menu-item:nth-child(2) { animation-name: expand2; animation-delay: 0.07s; }
.circular-menu.ready.active .menu-item:nth-child(3) { animation-name: expand3; animation-delay: 0.14s; }
.circular-menu.ready.active .menu-item:nth-child(4) { animation-name: expand4; animation-delay: 0.21s; }
.circular-menu.ready.active .menu-item:nth-child(5) { animation-name: expand5; animation-delay: 0.28s; }

.circular-menu.ready:not(.active) .menu-item {
  animation-duration: 0.35s;
  animation-timing-function: ease-in;
  animation-fill-mode: forwards;
}
.circular-menu.ready:not(.active) .menu-item:nth-child(1) { animation-name: collapse1; animation-delay: 0.28s; }
.circular-menu.ready:not(.active) .menu-item:nth-child(2) { animation-name: collapse2; animation-delay: 0.21s; }
.circular-menu.ready:not(.active) .menu-item:nth-child(3) { animation-name: collapse3; animation-delay: 0.14s; }
.circular-menu.ready:not(.active) .menu-item:nth-child(4) { animation-name: collapse4; animation-delay: 0.07s; }
.circular-menu.ready:not(.active) .menu-item:nth-child(5) { animation-name: collapse5; animation-delay: 0.00s; }

@keyframes expand1 { 0% { opacity:0; transform:scale(0); z-index:1; } 100% { opacity:1; transform:translate(0,-150px) scale(1); z-index:1; } }
@keyframes expand2 { 0% { opacity:0; transform:scale(0); z-index:1; } 100% { opacity:1; transform:translate(57px,-139px) scale(1); z-index:1; } }
@keyframes expand3 { 0% { opacity:0; transform:scale(0); z-index:1; } 100% { opacity:1; transform:translate(106px,-106px) scale(1); z-index:1; } }
@keyframes expand4 { 0% { opacity:0; transform:scale(0); z-index:1; } 100% { opacity:1; transform:translate(139px,-57px) scale(1); z-index:1; } }
@keyframes expand5 { 0% { opacity:0; transform:scale(0); z-index:1; } 100% { opacity:1; transform:translate(150px,0) scale(1); z-index:1; } }

@keyframes collapse1 { 0% { opacity:1; transform:translate(0,-150px) scale(1); z-index:1; } 100% { opacity:0; transform:translate(0,-150px) scale(0); z-index:-1; } }
@keyframes collapse2 { 0% { opacity:1; transform:translate(57px,-139px) scale(1); z-index:1; } 100% { opacity:0; transform:translate(57px,-139px) scale(0); z-index:-1; } }
@keyframes collapse3 { 0% { opacity:1; transform:translate(106px,-106px) scale(1); z-index:1; } 100% { opacity:0; transform:translate(106px,-106px) scale(0); z-index:-1; } }

@keyframes collapse5 { 0% { opacity:1; transform:translate(150px,0) scale(1); z-index:1; } 100% { opacity:0; transform:translate(150px,0) scale(0); z-index:-1; } }

.circular-menu svg { width: 24px; height: 24px; fill: currentColor; }

<script>
// ==================== سیستم صوتی ====================
let audioCtx = null;

function getAudioContext() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
}

function playTone(type, frequency, duration, volume = 0.15, rampDown = true) {
    try {
        const ctx = getAudioContext();
        const oscillator = ctx.createOscillator();
        const gainNode = ctx.createGain();
        
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, ctx.currentTime);
        
        gainNode.gain.setValueAtTime(volume, ctx.currentTime);
        if (rampDown) {
            gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        }
        
        oscillator.connect(gainNode);
        gainNode.connect(ctx.destination);
        
        oscillator.start(ctx.currentTime);
        oscillator.stop(ctx.currentTime + duration);
    } catch(e) {
        // در صورت خطا، صدا پخش نمی‌شود
    }
}

function playCorrectSound() {
    playTone('sine', 523, 0.2, 0.2, true);
    setTimeout(() => playTone('sine', 659, 0.2, 0.2, true), 100);
    setTimeout(() => playTone('sine', 784, 0.2, 0.2, true), 200);
}

function playWrongSound() {
    playTone('square', 150, 0.3, 0.15, true);
    setTimeout(() => playTone('square', 100, 0.3, 0.15, true), 150);
}

function playTargetChangeSound() {
    playTone('sine', 880, 0.3, 0.15, true);
    setTimeout(() => playTone('sine', 1100, 0.3, 0.15, true), 150);
}

function playGameOverSound() {
    playTone('sine', 400, 0.4, 0.15, true);
    setTimeout(() => playTone('sine', 350, 0.4, 0.15, true), 200);
    setTimeout(() => playTone('sine', 300, 0.5, 0.15, true), 400);
}

// ==================== تبدیل کسر به HTML فارسی و افقی ====================
function toPersianNumber(numStr) {
    const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
    return numStr.replace(/\d/g, d => persianDigits[parseInt(d)]);
}

function fractionToHTML(fractionStr) {
    const [num, den] = fractionStr.split('/');
    return `<span class="frac-horizontal">
        <span class="frac-num">${toPersianNumber(num)}</span>
        <span class="frac-bar"></span>
        <span class="frac-den">${toPersianNumber(den)}</span>
    </span>`;
}

// ==================== متغیرها و منطق بازی ====================
let score=0, life=5, time=120;
let rainInterval, targetInterval, timerInterval;
let blockClick=false;
let currentGroup, difficulty='easy';

// ===== ساده‌سازی کسر =====
function gcd(a,b){ return b===0?a:gcd(b,a%b); }
function simplifyFraction(num, den){ const g=gcd(num,den); return [num/g, den/g]; }

// ===== تولید کسرهای مساوی =====
function generateEquivalentFractions(targetNum, targetDen, maxNum, maxDen, maxMultiplier=8){
const equivalents=new Set();
const [simpNum, simpDen] = simplifyFraction(targetNum, targetDen);
for(let k=1; k<=maxMultiplier; k++){
let n=simpNum*k, d=simpDen*k;
if(n<=maxNum && d<=maxDen && !(n===targetNum && d===targetDen)){
equivalents.add(n+"/"+d);
}
}
for(let n=1; n<=maxNum; n++){
for(let d=1; d<=maxDen; d++){
const [sn, sd]=simplifyFraction(n,d);
if(sn===simpNum && sd===simpDen && !(n===targetNum && d===targetDen)){
equivalents.add(n+"/"+d);
}
}
}
return Array.from(equivalents);
}

// ===== شروع بازی =====
function startGame(level){
difficulty=level;
document.getElementById("menu").style.display="none";
document.getElementById("game").style.display="block";
resetGame();
}

// ===== ریست بازی =====
function resetGame(){
  document.getElementById("menu").style.display = "none";
  document.getElementById("game").style.display = "block";

  document.querySelectorAll(".fraction").forEach(d => d.remove());

  score=0; life=(difficulty==='easy')?5:3; time=120;
  document.getElementById("score").innerText = score;
  document.getElementById("life").innerText = life;
  document.getElementById("time").innerText = time;

  blockClick=false;

  changeTarget();
  startRain();
  clearInterval(targetInterval);
  clearInterval(timerInterval);
  targetInterval=setInterval(changeTarget,16000);
  timerInterval=setInterval(updateTime,1000);

  document.getElementById("endGameOverlay").style.display="none";
}

// ===== تولید گروه‌ها =====
function generateGroups(){
const groups=[];
let maxTargetNum=(difficulty==='easy')?5:10;
let maxTargetDen=(difficulty==='easy')?6:20;
let maxDropNum=(difficulty==='easy')?10:30;
let maxDropDen=(difficulty==='easy')?20:48;
for(let den=1; den<=maxTargetDen; den++){
for(let num=1; num<=maxTargetNum; num++){
let targetVal=num/den;
if(targetVal>0){
let traps=[];
for(let tn=1; tn<=maxDropNum; tn++){
for(let td=1; td<=maxDropDen; td++){
if(tn===num && td===den) continue;
traps.push(tn+"/"+td);
}
}
groups.push({target:num+"/"+den, traps:traps});
}
}
}
return groups;
}

// ===== انتخاب کسر هدف =====
function getValidGroup(){
const groups=generateGroups();
let probOver1=(difficulty==='hard')?0.1:0;
let filteredGroups;
if(difficulty==='hard'){
filteredGroups=groups.filter(g=>{
let [num, den]=g.target.split("/").map(Number);
return (num/den>=1)?Math.random()<probOver1:true;
});
}else filteredGroups=groups;
const group=filteredGroups[Math.floor(Math.random()*filteredGroups.length)];
const [num, den]=group.target.split("/").map(Number);
const maxDropNum=(difficulty==='easy')?10:30;
const maxDropDen=(difficulty==='easy')?20:48;
const maxMultiplier=(difficulty==='easy')?4:8;
group.equals=generateEquivalentFractions(num, den, maxDropNum, maxDropDen, maxMultiplier);
return group;
}

// ===== به‌روزرسانی قطره‌های موجود بعد از تغییر هدف =====
function updateExistingDrops(){
  const drops = document.querySelectorAll(".fraction");
  drops.forEach(d => {
    const [num, den] = d.kasr.split("/").map(Number);
    const [simpNum, simpDen] = simplifyFraction(num, den);
    const [targetNum, targetDen] = currentGroup.target.split("/").map(Number);
    const [simpTargetNum, simpTargetDen] = simplifyFraction(targetNum, targetDen);
    d.isCorrect = (simpNum === simpTargetNum && simpDen === simpTargetDen);
  });
}

// ===== تغییر کسر هدف =====
function changeTarget(){
blockClick=true;
let newGroup;
do{newGroup=getValidGroup();}while(currentGroup && newGroup.target===currentGroup.target);
currentGroup=newGroup;
document.getElementById("target").innerHTML = fractionToHTML(currentGroup.target);
updateExistingDrops();
const overlay=document.getElementById("changeOverlay");
overlay.innerHTML = "⚡ کسر هدف: " + fractionToHTML(currentGroup.target) + " ⚡";
overlay.style.opacity=1;
playTargetChangeSound();
setTimeout(()=>{overlay.style.opacity=0; blockClick=false;},1000);
}

// ===== زمان =====
function updateTime(){
time--;
document.getElementById("time").innerText=time;
if(time<=0) endGame("⏰ زمان تمام شد!");
}

// ===== بارش قطره‌ها =====
function startRain(){
const interval=(difficulty==='easy')?1200:800;
const equalPercent=(difficulty==='easy')?0.6:0.2;
rainInterval=setInterval(()=>{
const isCorrect=Math.random()<equalPercent;
const text=isCorrect?getUniqueDrop(currentGroup.equals):getUniqueDrop(currentGroup.traps);
if(text) createDrop(text);
},interval);
}

function getUniqueDrop(arr){
const existing=Array.from(document.querySelectorAll(".fraction")).map(d=>d.kasr);
const options=arr.filter(x=>!existing.includes(x));
if(options.length===0) return null;
return options[Math.floor(Math.random()*options.length)];
}

function createDrop(text){
const d=document.createElement("div");
d.className="fraction";
d.innerHTML = fractionToHTML(text);
d.kasr=text;
d.style.left=Math.random()*80+"%";
const duration=(difficulty==='easy')?(8+Math.random()*2):((8+Math.random()*2)/1.5);
d.style.animationDuration=duration+"s";
const [num, den] = d.kasr.split("/").map(Number);
const [simpNum, simpDen] = simplifyFraction(num, den);
const [targetNum, targetDen] = currentGroup.target.split("/").map(Number);
const [simpTargetNum, simpTargetDen] = simplifyFraction(targetNum, targetDen);
d.isCorrect = (simpNum === simpTargetNum && simpDen === simpTargetDen);

d.onclick=()=>{
if(blockClick) return;
if(d.isCorrect){
score++; 
document.getElementById("score").innerText = score;
d.style.backgroundColor="#4caf50";
playCorrectSound();
setTimeout(()=>d.remove(),300);
}else{
life--; 
document.getElementById("life").innerText = life;
d.style.backgroundColor="#f44336";
playWrongSound();
const heart=document.createElement("div");
heart.className="heartAnim"; heart.innerText="💔";
heart.style.left="50%"; heart.style.top="10%";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),1000);
setTimeout(()=>d.remove(),300);
}
if(life<=0) endGame("😢 جان‌ها تمام شد");
};
d.addEventListener("animationend",()=>d.remove());
document.body.appendChild(d);
}

// ===== پایان بازی =====
function endGame(msg){
clearInterval(rainInterval); 
clearInterval(targetInterval); 
clearInterval(timerInterval);

playGameOverSound();

blockClick = true;

const overlay=document.getElementById("endGameOverlay");
const message=document.getElementById("endGameMessage");
message.innerHTML=`امتیاز شما: ${score}<br>امیدوارم تجربه‌ی خوبی بوده باشه 🙏`;
overlay.style.display="flex";
}

// ===== دکمه‌ها =====
document.getElementById("restartBtn").onclick = resetGame;
document.getElementById("homeBtn").onclick = ()=>{
  document.getElementById("endGameOverlay").style.display="none";
  document.getElementById("game").style.display="none";
  document.getElementById("menu").style.display="block";
};
</script>

<!-- ===== اسکریپت منوی شبکه‌های اجتماعی (دقیقاً از فایل اصلی، بدون تغییر) ===== -->
<script>
  (function() {
    const menu = document.getElementById('circularMenu');
    const menuButton = document.querySelector('.menu-button');
    const menuItems = Array.from(document.querySelectorAll('.menu-item'));
    let isMenuOpen = false;
    let isInitialized = false;
    let isAnimating = false;
    const ANIMATION_LOCK_MS = 730;

    function setMenuState(open) {
      isMenuOpen = open;
      menu.classList.toggle('active', open);
      menuButton.setAttribute('aria-expanded', String(open));
      menuItems.forEach(item => item.setAttribute('tabindex', open ? '0' : '-1'));
    }

    function toggleMenu() {
      if (isAnimating) return;
      if (!isInitialized) {
        menu.classList.add('ready');
        isInitialized = true;
      }
      isAnimating = true;
      setMenuState(!isMenuOpen);
      setTimeout(() => { isAnimating = false; }, ANIMATION_LOCK_MS);
    }

    menuButton.addEventListener('click', function(e) {
      e.stopPropagation();
      toggleMenu();
    });

    document.addEventListener('click', function(e) {
      if (isMenuOpen && !menu.contains(e.target)) {
        setMenuState(false);
      }
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && isMenuOpen) {
        setMenuState(false);
        menuButton.focus();
      }
    });

    menu.addEventListener('click', function(e) {
      e.stopPropagation();
    });
  })();
</script>
