<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حافظه‌ی کلمات</title>
<style>
body{
    margin:0;
    font-family:tahoma;
    background:linear-gradient(135deg,#4dd0e1,#26c6da);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    transition: background .5s;
    overflow:hidden;
    position:relative;
}

.particles {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
}

.particle {
    position: absolute;
    background: rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    animation: float 15s infinite linear;
}

@keyframes float {
    0% {
        transform: translateY(0) translateX(0);
        opacity: 0;
    }
    10% {
        opacity: 0.3;
    }
    90% {
        opacity: 0.3;
    }
    100% {
        transform: translateY(-100vh) translateX(50px);
        opacity: 0;
    }
}

.container{
    width:95%;
    max-width:420px;
    text-align:center;
    z-index:1;
    position:relative;
}

h1{
    font-size:32px;
    margin-bottom:10px;
    color:#fff;
    text-shadow:0 0 10px rgba(255,255,255,0.5);
    animation:fadeInTitle 1s;
}

h3{
    font-size:16px;
    color:#f0f0f0;
    margin-bottom:25px;
    text-shadow:0 1px 2px rgba(0,0,0,0.2);
}

button.levelBtn{
    width:90%;
    padding:15px;
    font-size:18px;
    border:none;
    border-radius:15px;
    margin:10px 0;
    color:#fff;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
    transition: all 0.3s;
    border:2px solid rgba(255,255,255,0.1);
    font-weight:bold;
    position:relative;
    overflow:hidden;
}

button.levelBtn:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 25px rgba(0,0,0,0.35);
}

button.levelBtn:active{
    transform:translateY(-1px);
}

button.levelBtn::after {
    content:'';
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transform:translateX(-100%);
}

button.levelBtn:hover::after {
    transform:translateX(100%);
    transition:transform 0.6s;
}

#gameArea{ display:none; }

.top{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
}

.box{
    width:32%;
    background:linear-gradient(135deg, #e0f7fa, #b2ebf2);
    border-radius:15px;
    padding:12px 5px;
    font-size:14px;
    box-shadow:0 8px 20px rgba(0,0,0,0.15);
    border:2px solid rgba(255,255,255,0.3);
    transition:transform 0.3s;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.box:hover {
    transform:translateY(-2px);
}

.box b {
    display:block;
    font-size:22px;
    margin-top:5px;
    color:#333;
    text-align:center;
    width:100%;
}

.cards{
    display:flex;
    justify-content:space-between;
    margin:25px 0;
    gap:10px;
}

.card{
    width:22%;
    background:linear-gradient(145deg, #80deea, #4dd0e1);
    border-radius:20px;
    padding:15px 8px;
    font-size:16px;
    font-weight:bold;
    animation:fadeIn .5s;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    border:3px solid rgba(255,255,255,0.4);
    transition:all 0.5s;
    transform-style:preserve-3d;
    position:relative;
    cursor:pointer;
    min-height:80px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.card.flipped {
    transform:rotateY(180deg);
    background:linear-gradient(145deg, #26c6da, #00acc1);
}

.card-content {
    backface-visibility:hidden;
    width:100%;
    text-align:center;
}

.card span{
    display:block;
    font-size:11px;
    color:#fff;
    margin-bottom:8px;
    text-shadow:0 1px 2px rgba(0,0,0,0.3);
    letter-spacing:1px;
}

.card .card-word {
    font-size:18px;
    color:#000;
    text-shadow:0 1px 2px rgba(255,255,255,0.5);
    word-break:break-word;
    font-weight:bold;
}

.hidden{
    background:linear-gradient(145deg, #26c6da, #00acc1);
    color:transparent;
}

.hidden .card-word {
    color:transparent;
    text-shadow:none;
}

input{
    width:100%;
    padding:15px;
    font-size:16px;
    border-radius:15px;
    border:2px solid #4dd0e1;
    text-align:center;
    box-sizing:border-box;
    background:rgba(255,255,255,0.95);
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    transition:all 0.3s;
}

input:focus{
    outline:none;
    border-color:#26c6da;
    box-shadow:0 0 0 3px rgba(38,198,218,0.2);
    transform:translateY(-2px);
}

button.submitBtn{
    margin-top:15px;
    width:100%;
    padding:15px;
    font-size:16px;
    border:none;
    border-radius:15px;
    background:linear-gradient(135deg, #00bcd4, #0097a7);
    color:#fff;
    box-sizing:border-box;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(0,188,212,0.3);
    transition:all 0.3s;
    border:2px solid rgba(255,255,255,0.3);
    font-weight:bold;
}

button.submitBtn:hover:not(:disabled){
    transform:translateY(-3px);
    box-shadow:0 12px 25px rgba(0,188,212,0.4);
    background:linear-gradient(135deg, #00acc1, #00838f);
}

button.submitBtn:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

.mark{
    font-size:48px;
    margin-top:15px;
    animation:pop .4s;
    text-shadow:0 2px 10px rgba(0,0,0,0.2);
}

.correct{ 
    color:#4CAF50;
    filter:drop-shadow(0 0 8px rgba(76,175,80,0.4));
}
.wrong{ 
    color:#F44336;
    filter:drop-shadow(0 0 8px rgba(244,67,54,0.4));
}

.result{
    margin-top:15px;
    font-weight:bold;
    font-size:17px;
    color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,0.3);
    background:rgba(0,0,0,0.2);
    padding:10px;
    border-radius:10px;
}

.end{
    margin-top:20px;
}

.end-buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 25px;
    gap: 15px;
}

.endBtn {
    flex: 1;
    padding: 18px;
    font-size: 16px;
    border: none;
    border-radius: 15px;
    color: white;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    transition: all 0.3s;
    box-sizing:border-box;
    font-weight:bold;
    border:2px solid rgba(255,255,255,0.3);
}

.endBtn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(0,0,0,0.35);
}

#restartBtn {
    background: linear-gradient(135deg, #4CAF50, #2E7D32);
}

#mainMenuBtn {
    background: linear-gradient(135deg, #2196F3, #0D47A1);
}

.end-content {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 25px;
    padding: 35px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
    animation: fadeIn 0.5s;
    backdrop-filter: blur(10px);
    border:2px solid rgba(255,255,255,0.3);
}

.end-content p {
    background: linear-gradient(135deg, #f5f5f5, #e0e0e0);
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,.1);
    margin-bottom: 25px;
    font-size: 18px;
    color: #333;
    line-height: 1.6;
    border:2px solid rgba(255,255,255,0.5);
}

.hidden-element {
    display: none !important;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px) scale(.9)}
    to{opacity:1; transform:translateY(0) scale(1)}
}
@keyframes fadeInTitle{
    from{opacity:0; transform:translateY(-20px)}
    to{opacity:1; transform:translateY(0)}
}
@keyframes pop{
    from{transform:scale(.6) rotate(-10deg)}
    to{transform:scale(1) rotate(0)}
}
@keyframes flip {
    0% { transform: rotateY(0); }
    100% { transform: rotateY(180deg); }
}

/* ===== استایل‌های منوی شبکه‌های اجتماعی ===== */
:root {
    --neon-primary: #0ff;
    --neon-secondary: #f0f;
    --bg-dark: #121212;
}

.circular-menu {
    position: fixed;
    bottom: 25px;
    left: 25px;
    width: 60px;
    height: 60px;
    z-index: 9999;
}

.circular-menu .menu-button {
    position: absolute;
    top: 0; left: 0;
    width: 58px; height: 58px;
    border-radius: 50%;
    background-color: var(--bg-dark);
    color: var(--neon-primary);
    border: 2px solid var(--neon-primary);
    cursor: pointer;
    z-index: 2;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 0 8px var(--neon-primary),
                0 0 15px var(--neon-primary),
                0 0 30px var(--neon-primary),
                inset 0 0 15px rgba(0, 255, 255, 0.2);
    transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    -webkit-tap-highlight-color: transparent;
}

.circular-menu .menu-button:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 3px;
}

.circular-menu.active .menu-button {
    background-color: #1a0a1a;
    color: var(--neon-secondary);
    border-color: var(--neon-secondary);
    transform: rotate(135deg);
    box-shadow: 0 0 10px var(--neon-secondary),
                0 0 20px var(--neon-secondary),
                0 0 40px var(--neon-secondary),
                inset 0 0 20px rgba(255, 0, 255, 0.3);
}

.circular-menu .menu-item {
    position: absolute;
    top: 0; left: 0;
    width: 52px; height: 52px;
    border-radius: 50%;
    background-color: #ffffff;
    color: #2c3e50;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    transform: scale(0);
    z-index: -1;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    pointer-events: none;
    visibility: hidden;
}

.circular-menu.active .menu-item {
    pointer-events: auto;
    visibility: visible;
}

.menu-item:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 2px;
}

.menu-item.instagram:hover, .menu-item.instagram:focus-visible { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: white; }
.menu-item.telegram:hover, .menu-item.telegram:focus-visible { background: #0088cc; color: white; }
.menu-item.aparat:hover, .menu-item.aparat:focus-visible { background: #ed1c24; color: white; }
.menu-item.website:hover, .menu-item.website:focus-visible { background: #4facfe; color: white; }
.menu-item.webapp:hover, .menu-item.webapp:focus-visible { background: #6c5ce7; color: white; }

.circular-menu.ready.active .menu-item {
    animation-duration: 0.45s;
    animation-timing-function: cubic-bezier(0.68, -0.55, 0.27, 1.55);
    animation-fill-mode: forwards;
}
.circular-menu.ready.active .menu-item:nth-child(1) { animation-name: expand1; animation-delay: 0.00s; }
.circular-menu.ready.active .menu-item:nth-child(2) { animation-name: expand2; animation-delay: 0.07s; }
.circular-menu.ready.active .menu-item:nth-child(3) { animation-name: expand3; animation-delay: 0.14s; }
.circular-menu.ready.active .menu-item:nth-child(4) { animation-name: expand4; animation-delay: 0.21s; }
.circular-menu.ready.active .menu-item:nth-child(5) { animation-name: expand5; animation-delay: 0.28s; }

.circular-menu.ready:not(.active) .menu-item {
    animation-duration: 0.35s;
    animation-timing-function: ease-in;
    animation-fill-mode: forwards;
}
.circular-menu.ready:not(.active) .menu-item:nth-child(1) { animation-name: collapse1; animation-delay: 0.28s; }
.circular-menu.ready:not(.active) .menu-item:nth-child(2) { animation-name: collapse2; animation-delay: 0.21s; }
.circular-menu.ready:not(.active) .menu-item:nth-child(3) { animation-name: collapse3; animation-delay: 0.14s; }
.circular-menu.ready:not(.active) .menu-item:nth-child(4) { animation-name: collapse4; animation-delay: 0.07s; }
.circular-menu.ready:not(.active) .menu-item:nth-child(5) { animation-name: collapse5; animation-delay: 0.00s; }

@keyframes expand1 { 0% { opacity:0; transform:scale(0); z-index:1; } 100% { opacity:1; transform:translate(0,-150px) scale(1); z-index:1; } }
@keyframes expand2 { 0% { opacity:0; transform:scale(0); z-index:1; } 100% { opacity:1; transform:translate(57px,-139px) scale(1); z-index:1; } }
@keyframes expand3 { 0% { opacity:0; transform:scale(0); z-index:1; } 100% { opacity:1; transform:translate(106px,-106px) scale(1); z-index:1; } }
@keyframes expand4 { 0% { opacity:0; transform:scale(0); z-index:1; } 100% { opacity:1; transform:translate(139px,-57px) scale(1); z-index:1; } }
@keyframes expand5 { 0% { opacity:0; transform:scale(0); z-index:1; } 100% { opacity:1; transform:translate(150px,0) scale(1); z-index:1; } }

@keyframes collapse1 { 0% { opacity:1; transform:translate(0,-150px) scale(1); z-index:1; } 100% { opacity:0; transform:translate(0,-150px) scale(0); z-index:-1; } }
@keyframes collapse2 { 0% { opacity:1; transform:translate(57px,-139px) scale(1); z-index:1; } 100% { opacity:0; transform:translate(57px,-139px) scale(0); z-index:-1; } }
@keyframes collapse3 { 0% { opacity:1; transform:translate(106px,-106px) scale(1); z-index:1; } 100% { opacity:0; transform:translate(106px,-106px) scale(0); z-index:-1; } }
@keyframes collapse4 { 0% { opacity:1; transform:translate(139px,-57px) scale(1); z-index:1; } 100% { opacity:0; transform:translate(139px,-57px) scale(0); z-index:-1; } }
@keyframes collapse5 { 0% { opacity:1; transform:translate(150px,0) scale(1); z-index:1; } 100% { opacity:0; transform:translate(150px,0) scale(0); z-index:-1; } }

.circular-menu svg { width: 24px; height: 24px; fill: currentColor; }
</style>
</head>

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>
    </a>

    <button class="menu-button" title="شبکه‌های اجتماعی" aria-label="باز کردن منوی شبکه‌های اجتماعی"
            aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
    </button>
</div>

<script>
// ===== اسکریپت بازی (بدون تغییر) =====
const words = [
"لطیف","عجیب","ایستگاه","عمیق","مطالعه","طبیعت","گوارا","موضوع","حلقه","تالاب",
"صبحگاه","عنکبوت","گلبرگ","هنرمندانه","غرور","کهن","طبیب","خلاصه","تعیین","نقطه",
"نکته","موفقیت","شرط","پروردگار","میهن","حاضر","کارگاه","دلگشا","حوادث","روزگار",
"کاهلی","خصلت","محافظت","ویژگی","معمولا","فضا","معلوم","عقل","هلاک","موذی",
"فضیلت","قامت","علاقه","منتظر","مواظبت","طلبید","طبیبان","طمع","هاون","شبیه","دهقان"
];

let playerName = '';
let score = 0;
let totalTime = 120;
let roundTime = 7;
let level = 1;
let selected = [];
let askIndex = 0;
let totalTimer;

function createParticles() {
    const particlesContainer = document.createElement('div');
    particlesContainer.className = 'particles';
    document.body.appendChild(particlesContainer);
    
    for(let i = 0; i < 20; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        
        const size = Math.random() * 15 + 5;
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.left = `${Math.random() * 100}%`;
        particle.style.top = `${Math.random() * 100}%`;
        particle.style.animationDelay = `${Math.random() * 15}s`;
        particle.style.opacity = Math.random() * 0.5;
        
        particlesContainer.appendChild(particle);
    }
}

createParticles();

function startGame(lvl){
    const nameInput = document.getElementById('playerName').value.trim();
    if(!nameInput){
        alert('لطفاً نام خود را وارد کنید!');
        return;
    }
    playerName = nameInput;
    level = lvl;
    document.getElementById('mainMenu').style.display='none';
    document.getElementById('gameArea').style.display='block';

    if(level===1) roundTime=7;
    else if(level===2) roundTime=5;
    else roundTime=3;

    document.body.style.background = lvl===1?'linear-gradient(135deg,#ff8a65,#ff7043)':
                                   lvl===2?'linear-gradient(135deg,#4db6ac,#26a69a)':
                                   'linear-gradient(135deg,#ffb74d,#ffa726)';

    score = 0;
    totalTime = 120;
    document.getElementById('score').innerText=score;
    document.getElementById('totalTime').innerText=totalTime;
    document.getElementById('roundTime').innerText=roundTime;

    totalTimer = setInterval(()=>{
        totalTime--;
        document.getElementById('totalTime').innerText = totalTime;
        if(totalTime <= 0){
            clearInterval(totalTimer);
            endGame();
        }
    },1000);

    startRound();
}

function startRound(){
    if(totalTime <= 0) return;

    document.getElementById('mark').innerHTML='';
    document.getElementById('answer').value='';
    document.getElementById('answer').disabled = true;
    document.getElementById('submitBtn').disabled = true;
    document.getElementById('result').innerText='';

    let numCards = level===1?3:4;

    selected=[];
    while(selected.length<numCards){
        const w = words[Math.floor(Math.random()*words.length)];
        if(!selected.includes(w)) selected.push(w);
    }

    const cardsDiv=document.getElementById('cards');
    cardsDiv.innerHTML='';
    selected.forEach((w,i)=>{
        const d=document.createElement('div');
        d.className='card';
        d.innerHTML=`
            <div class="card-content">
                <span>کارت ${i+1}</span>
                <div class="card-word">${w}</div>
            </div>
        `;
        d.style.animationDelay = `${i * 0.1}s`;
        cardsDiv.appendChild(d);
    });

    askIndex=Math.floor(Math.random()*numCards);

    let tTime = level===1?7:level===2?5:3;
    roundTime = tTime;
    document.getElementById('roundTime').innerText=roundTime;

    const rTimer = setInterval(()=>{
        roundTime--;
        document.getElementById('roundTime').innerText=roundTime;
        if(roundTime<=0){
            clearInterval(rTimer);
            hideCards();
        }
    },1000);
}

function hideCards(){
    document.querySelectorAll('.card').forEach((card, index) => {
        setTimeout(() => {
            card.classList.add('flipped');
            setTimeout(() => {
                const wordDiv = card.querySelector('.card-word');
                if(wordDiv) {
                    wordDiv.style.color = 'transparent';
                    wordDiv.style.textShadow = 'none';
                }
            }, 250);
        }, index * 100);
    });
    
    setTimeout(() => {
        document.getElementById('answer').disabled=false;
        document.getElementById('submitBtn').disabled=false;
        document.getElementById('result').innerText=`کلمه کارت ${askIndex+1} را بنویسید:`;
    }, selected.length * 100 + 300);
}

function checkAnswer(){
    const user = document.getElementById('answer').value.trim();
    const mark = document.getElementById('mark');
    mark.innerHTML='';

    if(user===selected[askIndex]){
        score++;
        document.getElementById('score').innerText=score;
        mark.innerHTML='✔️';
        mark.className='mark correct';
    }else{
        mark.innerHTML='✖️';
        mark.className='mark wrong';
    }

    setTimeout(()=>{ 
        mark.innerHTML=''; 
        startRound(); 
    },800);
}

function endGame(){
    clearInterval(totalTimer);
    document.getElementById('cards').innerHTML='';
    document.getElementById('mark').innerHTML='';
    document.getElementById('result').innerText='';
    document.getElementById('roundTime').innerText='0';

    document.getElementById('answer').classList.add('hidden-element');
    document.getElementById('submitBtn').classList.add('hidden-element');

    const endDiv = document.getElementById('end');
    endDiv.innerHTML = `
        <div class="end-content">
            <p id="endMessage"></p>
            <div class="end-buttons">
                <button id="restartBtn" class="endBtn">🔄 بازی جدید</button>
                <button id="mainMenuBtn" class="endBtn">🏠 صفحه اصلی</button>
            </div>
        </div>
    `;
    const msg = document.getElementById('endMessage');
    msg.innerHTML = `🌟 <span id="safeName"></span> خسته نباشی!<br>امتیاز شما: <b>${score}</b>`;
    document.getElementById('safeName').textContent = playerName;

    document.getElementById('restartBtn').addEventListener('click', restartGame);
    document.getElementById('mainMenuBtn').addEventListener('click', goToMainMenu);
}

function restartGame() {
    document.getElementById('end').innerHTML = '';
    document.getElementById('answer').classList.remove('hidden-element');
    document.getElementById('submitBtn').classList.remove('hidden-element');
    document.getElementById('cards').innerHTML = '';
    document.getElementById('mark').innerHTML = '';
    document.getElementById('mark').className = '';
    document.getElementById('result').innerText = '';
    
    totalTime = 120;
    score = 0;
    document.getElementById('score').innerText = score;
    document.getElementById('totalTime').innerText = totalTime;
    document.getElementById('roundTime').innerText = roundTime;
    
    document.getElementById('answer').disabled = true;
    document.getElementById('submitBtn').disabled = true;
    document.getElementById('answer').value = '';
    
    clearInterval(totalTimer);
    
    totalTimer = setInterval(() => {
        totalTime--;
        document.getElementById('totalTime').innerText = totalTime;
        if (totalTime <= 0) {
            clearInterval(totalTimer);
            endGame();
        }
    }, 1000);
    
    startRound();
}

function goToMainMenu() {
    clearInterval(totalTimer);
    score = 0;
    totalTime = 120;
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('mainMenu').style.display = 'block';
    document.getElementById('end').innerHTML = '';
    document.getElementById('answer').classList.remove('hidden-element');
    document.getElementById('submitBtn').classList.remove('hidden-element');
    document.getElementById('answer').value = '';
    document.getElementById('result').innerText = '';
    document.getElementById('mark').innerHTML = '';
    document.getElementById('cards').innerHTML = '';
    document.body.style.background = 'linear-gradient(135deg, #4dd0e1, #26c6da)';
}

// ===== اسکریپت منوی شبکه‌های اجتماعی =====
(function() {
    const menu = document.getElementById('circularMenu');
    const menuButton = document.querySelector('.menu-button');
    const menuItems = Array.from(document.querySelectorAll('.menu-item'));
    let isMenuOpen = false;
    let isInitialized = false;
    let isAnimating = false;
    const ANIMATION_LOCK_MS = 730;

    function setMenuState(open) {
        isMenuOpen = open;
        menu.classList.toggle('active', open);
        menuButton.setAttribute('aria-expanded', String(open));
        menuItems.forEach(item => item.setAttribute('tabindex', open ? '0' : '-1'));
    }

    function toggleMenu() {
        if (isAnimating) return;
        if (!isInitialized) {
            menu.classList.add('ready');
            isInitialized = true;
        }
        isAnimating = true;
        setMenuState(!isMenuOpen);
        setTimeout(() => { isAnimating = false; }, ANIMATION_LOCK_MS);
    }

    menuButton.addEventListener('click', function(e) {
        e.stopPropagation();
        toggleMenu();
    });

    document.addEventListener('click', function(e) {
        if (isMenuOpen && !menu.contains(e.target)) {
            setMenuState(false);
        }
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && isMenuOpen) {
            setMenuState(false);
            menuButton.focus();
        }
    });

    menu.addEventListener('click', function(e) {
        e.stopPropagation();
    });
})();
</script>

</body>
</html>
