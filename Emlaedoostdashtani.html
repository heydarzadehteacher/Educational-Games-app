// ===== صداها با Web Audio API =====
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playTone(freq, duration, type='sine', volume=0.3){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function playCorrectSound(){
    playTone(523, 0.15, 'sine', 0.3);
    setTimeout(()=>playTone(659, 0.15, 'sine', 0.3), 150);
    setTimeout(()=>playTone(784, 0.25, 'sine', 0.4), 300);
}

function playWrongSound(){
    playTone(200, 0.4, 'sawtooth', 0.25);
}

function playFinishSound(){
    playTone(523, 0.3, 'sine', 0.3);
    setTimeout(()=>playTone(659, 0.3, 'sine', 0.3), 300);
    setTimeout(()=>playTone(784, 0.5, 'sine', 0.5), 600);
}

function launchConfetti(count=80){
    const container = document.getElementById('confettiContainer');
    container.innerHTML = '';
    const colors = ['#ff0','#f0f','#0ff','#f00','#0f0','#00f','#ffa500','#ff69b4'];
    for(let i=0; i<count; i++){
        const piece = document.createElement('div');
        piece.className = 'confettiPiece';
        const size = Math.random()*8 + 4;
        const left = Math.random()*100;
        const delay = Math.random()*2;
        const duration = Math.random()*2 + 2;
        const color = colors[Math.floor(Math.random()*colors.length)];
        Object.assign(piece.style, {
            left: left+'%',
            width: size+'px',
            height: size*0.6+'px',
            background: color,
            animationDuration: duration+'s',
            animationDelay: delay+'s',
            borderRadius: Math.random()>0.5 ? '50%' : '2px'
        });
        container.appendChild(piece);
    }
    setTimeout(()=>container.innerHTML='', 5000);
}

  document.querySelectorAll('.game-section').forEach(s=>s.style.display='none');
  document.getElementById('confettiContainer').innerHTML = '';
}

function enterGame(section){
  document.querySelector('.container').style.display='none';
  document.querySelectorAll('.game-section').forEach(s=>s.style.display='none');
  document.getElementById(section).style.display='block';
  document.getElementById('confettiContainer').innerHTML = '';
  if(section==='wordmaker'){ startWordmaker(); }
  if(section==='missing-letter'){ startMissingLetter(); }
}

let wm_currentWord='', wm_score=0, wm_life=3, wm_time=100, wm_timer;

function shuffleString(str){ return str.split('').sort(()=>Math.random()-0.5).join(''); }

function startWordmaker(){
  wm_gameActive = true;
  wm_score=0; wm_life=3; wm_time=100;
  document.getElementById('wm-scoreValue').innerText = wm_score;
  document.getElementById('wm-lifeValue').innerText = wm_life;
  document.getElementById('wm-timeValue').innerText = wm_time;
  document.getElementById('wm-result').innerText = '';
  document.getElementById('wm-result').className = 'result-message';
  document.getElementById('wm-endButtons').style.display = 'none';
  document.getElementById('wm-submitBtn').disabled = false;
  nextWordmaker();
  if(wm_timer) clearInterval(wm_timer);
  wm_timer = setInterval(() => {
    if (!wm_gameActive) { clearInterval(wm_timer); return; }
    wm_time--;
    document.getElementById('wm-timeValue').innerText = wm_time;
    if(wm_time <= 0) endWordmaker();
  }, 1000);
}

function nextWordmaker(){
  if (!wm_gameActive) return;
  let index = Math.floor(Math.random() * wm_words.length);
  wm_currentWord = wm_words[index];
  let scrambled = shuffleString(wm_currentWord);
  let lettersContainer = document.getElementById('wm-letters');
  lettersContainer.innerHTML = '';
  for(let i = 0; i < scrambled.length; i++){
    let box = document.createElement('div');
    box.className = 'letter-box';
    box.innerText = scrambled[i];
    box.style.animationDelay = (i * 0.2) + 's';
    lettersContainer.appendChild(box);
  }
  document.getElementById('wm-answer').value = '';
  document.getElementById('wm-submitBtn').disabled = false;
}

function checkWordmaker(){
  if (!wm_gameActive) return;
  let ans = document.getElementById('wm-answer').value.trim();
  let result = document.getElementById('wm-result');
  if(ans === wm_currentWord){
    wm_score++;
    document.getElementById('wm-scoreValue').innerText = wm_score;
    result.innerText = '✔ پاسخ درست!';
    result.className = 'result-message correct';
    playCorrectSound();
  } else {
    wm_life--;
    document.getElementById('wm-lifeValue').innerText = wm_life;
    result.innerText = '✖ پاسخ اشتباه! پاسخ درست: ' + wm_currentWord;
    result.className = 'result-message wrong';
    playWrongSound();
  }
  document.getElementById('wm-submitBtn').disabled = true;
  if(wm_life <= 0){ 
    setTimeout(endWordmaker, 800);
  } else { 
    setTimeout(() => { 
      if (wm_gameActive) {
        result.className = 'result-message';
        result.innerText = '';
        nextWordmaker();
      }
    }, 900);
  }
}

function endWordmaker(){
  wm_gameActive = false;
  clearInterval(wm_timer);
  document.getElementById('wm-letters').innerHTML = '';
  document.getElementById('wm-result').innerText = 'خسته نباشید! امتیاز شما: ' + wm_score;
  document.getElementById('wm-result').className = 'result-message';
  document.getElementById('wm-endButtons').style.display = 'flex';
  document.getElementById('wm-submitBtn').disabled = true;
  playFinishSound();
  launchConfetti(100);
}

  {word:'مواظبت',missing:'ظ',options:['ظ','ز','ذ','ض']},
  {word:'علاقه',missing:'ع',options:['ا','ع']},
  {word:'تنها',missing:'ه',options:['ه','ح']},
  {word:'گذشت',missing:'ذ',options:['ذ','ز','ض','ظ']},
  {word:'هیجان',missing:'ه',options:['ح','ه']},
  {word:'منتظر',missing:'ظ',options:['ذ','ز','ظ','ض']},
  {word:'طلبیدن',missing:'ط',options:['ت','ط']},
  {word:'حاکم',missing:'ح',options:['ه','ح']},
  {word:'حاصل',missing:'ص',options:['ث','س','ص']},
  {word:'اهتزاز',missing:'ه',options:['ح','ه']},
  {word:'روحیه',missing:'ح',options:['ه','ح']},
  {word:'آهنگ',missing:'ه',options:['ه','ح']},
  {word:'از خود گذشتگی',missing:'ذ',options:['ذ','ز','ظ','ض']},
  {word:'گذشته',missing:'ذ',options:['ذ','ز','ظ','ض']},
  {word:'غرور',missing:'غ',options:['غ','ق']},
  {word:'مدال طلا',missing:'ط',options:['ت','ط']},
  {word:'عظمت',missing:'ظ',options:['ذ','ز','ظ','ض']},
  {word:'تصوّر',missing:'ص',options:['س','ث','ص']},
  {word:'گام استوار',missing:'گ',options:['ق','گ']},
  {word:'هجوم',missing:'ه',options:['ح','ه']},
  {word:'گذرگاه',missing:'ذ',options:['ذ','ز','ظ','ض']}
];

let ml_currentIndex = 0;
let ml_score = 0, ml_life = 3, ml_time = 45, ml_timer;

function startMissingLetter(){ 
  ml_gameActive = true;
  ml_score = 0; ml_life = 3; ml_time = 45;
  document.getElementById('ml-scoreValue').innerText = ml_score;
  document.getElementById('ml-lifeValue').innerText = ml_life;
  document.getElementById('ml-timeValue').innerText = ml_time;
  document.getElementById('ml-result').innerText = '';
  document.getElementById('ml-result').className = 'result-message';
  document.getElementById('ml-endButtons').style.display = 'none';
  ml_currentIndex = Math.floor(Math.random() * ml_wordsData.length); 
  showMLWord(); 
  if(ml_timer) clearInterval(ml_timer); 
  ml_timer = setInterval(() => { 
    if (!ml_gameActive) { clearInterval(ml_timer); return; }
    ml_time--; 
    document.getElementById('ml-timeValue').innerText = ml_time; 
    if(ml_time <= 0) endMissingLetter(); 
  }, 1000); 
}

function showMLWord(){ 
  if (!ml_gameActive) return;
  let data = ml_wordsData[ml_currentIndex]; 
  document.getElementById('ml-letterContainer').innerText = data.word.replace(data.missing, '_'); 
  let optionsContainer = document.getElementById('ml-optionsContainer'); 
  optionsContainer.innerHTML = ''; 
  data.options.sort(() => Math.random() - 0.5); 
  data.options.forEach(opt => { 
    let btn = document.createElement('button'); 
    btn.className = 'option-btn'; 
    btn.innerText = opt; 
    btn.onclick = () => checkMLAnswer(opt, btn); 
    optionsContainer.appendChild(btn); 
  }); 
}

function checkMLAnswer(ans, btn){ 
  if (!ml_gameActive) return;
  let data = ml_wordsData[ml_currentIndex]; 
  let result = document.getElementById('ml-result'); 
  document.querySelectorAll('#ml-optionsContainer .option-btn').forEach(b => b.disabled = true);
  if(ans === data.missing){ 
    ml_score++; 
    document.getElementById('ml-scoreValue').innerText = ml_score; 
    result.innerText = '✔ پاسخ درست!'; 
    result.className = 'result-message correct';
    playCorrectSound();
  } else { 
    ml_life--; 
    document.getElementById('ml-lifeValue').innerText = ml_life; 
    result.innerText = '✖ پاسخ اشتباه! پاسخ درست: ' + data.missing; 
    result.className = 'result-message wrong';
    playWrongSound();
  } 
  if(ml_life <= 0){ 
    setTimeout(endMissingLetter, 800);
  } else { 
    setTimeout(() => {
      if (ml_gameActive) {
        result.className = 'result-message';
        result.innerText = '';
        ml_currentIndex = Math.floor(Math.random() * ml_wordsData.length); 
        showMLWord();
      }
    }, 900);
  } 
}

function endMissingLetter(){ 
  ml_gameActive = false;
  clearInterval(ml_timer); 
  document.getElementById('ml-letterContainer').innerText = ''; 
  document.getElementById('ml-optionsContainer').innerHTML = ''; 
  document.getElementById('ml-result').innerText = 'خسته نباشید! امتیاز شما: ' + ml_score; 
  document.getElementById('ml-result').className = 'result-message';
  document.getElementById('ml-endButtons').style.display = 'flex';
  playFinishSound();
  launchConfetti(100);
}
</script>
