<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>بازی حافظه‌ی املایی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: #efe6dd;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== صفحه اصلی ===== */
        #homePage {
            width: 100%;
            max-width: 800px;
            height: fit-content;
            max-height: 98vh;
            background: #efe6dd;
            border-radius: 35px;
            padding: 28px 30px 32px;
            box-shadow: 12px 12px 24px rgba(0, 0, 0, 0.1), -12px -12px 24px rgba(255, 255, 255, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .game-title {
            text-align: center;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            font-weight: 900;
            margin-bottom: 22px;
            background: linear-gradient(45deg, #ff6b6b, #f6681b, #1433bd, #0a1334);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientShift 4s ease-in-out infinite, float 3s ease-in-out infinite;
            white-space: nowrap;
            letter-spacing: 2px;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        .name-box {
            background-color: #efe6dd;
            border-radius: 30px;
            padding: 10px 20px;
            margin-bottom: 28px;
            box-shadow: inset 4px 4px 10px rgba(0, 0, 0, 0.06), inset -4px -4px 10px rgba(255, 255, 255, 0.8), 6px 6px 14px rgba(0, 0, 0, 0.08), -6px -6px 14px rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .name-box .user-icon {
            font-size: 1.9rem;
            line-height: 1;
            filter: drop-shadow(1px 2px 4px rgba(0, 0, 0, 0.1));
        }

        .name-box input {
            background: transparent;
            border: none;
            outline: none;
            padding: 14px 10px;
            border-radius: 20px;
            font-size: 1.1rem;
            width: 75%;
            max-width: 340px;
            caret-color: #9a0002;
            text-align: center;
            color: #1e1e2a;
            font-weight: 500;
            box-shadow: inset 2px 2px 6px rgba(0, 0, 0, 0.06), inset -2px -2px 6px rgba(255, 255, 255, 0.7);
            transition: box-shadow 0.2s;
        }

        .name-box input:focus {
            box-shadow: inset 3px 3px 8px rgba(0, 0, 0, 0.08), inset -3px -3px 8px rgba(255, 255, 255, 0.9);
        }

        .name-box input::placeholder {
            color: #7a6a5a;
            opacity: 0.7;
            font-weight: 300;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
            gap: 18px;
        }

        .game-btn {
            border: none;
            cursor: pointer;
            border-radius: 25px;
            padding: 26px 12px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 8px 8px 16px rgba(0, 0, 0, 0.15), -8px -8px 16px rgba(255, 255, 255, 0.6), inset 2px 2px 6px rgba(255, 255, 255, 0.2), inset -2px -2px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            line-height: 1.3;
        }

        .game-btn .emoji-big {
            font-size: 2.2rem;
            display: block;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.15));
        }

        .game-btn:hover {
            transform: translateY(-4px);
            box-shadow: 12px 12px 20px rgba(0, 0, 0, 0.2), -12px -12px 20px rgba(255, 255, 255, 0.7), inset 2px 2px 6px rgba(255, 255, 255, 0.2), inset -2px -2px 6px rgba(0, 0, 0, 0.1);
        }

        .game-btn:active {
            transform: translateY(0);
            box-shadow: inset 4px 4px 8px rgba(0, 0, 0, 0.2), inset -4px -4px 8px rgba(255, 255, 255, 0.3);
        }

        .btn-1 {
            background-color: #0a1334;
        }
        .btn-2 {
            background-color: #1433bd;
        }
        .btn-3 {
            background-color: #cdfc8a;
            color: #0a1334;
        }
        .btn-4 {
            background-color: #f6681b;
        }

        /* ===== هدر مشترک بازی‌ها ===== */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff20;
            padding: 12px 18px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: inset 2px 2px 6px rgba(0, 0, 0, 0.05), inset -2px -2px 6px rgba(255, 255, 255, 0.8);
            flex-wrap: wrap;
            gap: 10px;
        }

        .game-header .stat {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #1e1e2a;
            background: #efe6dd;
            padding: 6px 14px;
            border-radius: 15px;
            box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.06), inset -2px -2px 5px rgba(255, 255, 255, 0.7);
        }

        .stat-icon {
            font-size: 1.3rem;
        }

        .home-btn {
            background: #9a0002;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 15px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.15), -4px -4px 10px rgba(255, 255, 255, 0.3);
        }

        .home-btn:hover {
            transform: scale(1.05);
            box-shadow: 6px 6px 14px rgba(0, 0, 0, 0.2);
        }

        /* ===== صفحات بازی ===== */
        #gamePage1,
        #gamePage2,
        #gamePage3,
        #gamePage4 {
            display: none;
            width: 100%;
            max-width: 800px;
            height: fit-content;
            max-height: 98vh;
            background: #efe6dd;
            border-radius: 35px;
            padding: 20px 25px 25px;
            box-shadow: 12px 12px 24px rgba(0, 0, 0, 0.1), -12px -12px 24px rgba(255, 255, 255, 0.7);
        }

        /* ===== استایل‌های بازی واژه‌ی غایب ===== */
        .words-display {
            background: #ffffff40;
            padding: 30px 20px;
            border-radius: 25px;
            margin: 15px 0;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            min-height: 120px;
            align-items: center;
            box-shadow: inset 4px 4px 12px rgba(0, 0, 0, 0.08), inset -4px -4px 12px rgba(255, 255, 255, 0.6);
        }

        .word-item {
            background: #0a1334;
            color: white;
            padding: 12px 20px;
            border-radius: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.15);
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .question-text {
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            color: #1e1e2a;
            margin: 15px 0;
            padding: 15px;
            background: #ffffff30;
            border-radius: 20px;
            box-shadow: inset 2px 2px 6px rgba(0, 0, 0, 0.05);
            display: none;
        }

        .options-container {
            display: none;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin: 15px 0;
        }

        .option-btn {
            background: white;
            border: none;
            padding: 15px 10px;
            border-radius: 18px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            color: #1e1e2a;
            transition: all 0.2s;
            box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.08), -4px -4px 10px rgba(255, 255, 255, 0.7);
        }

        .option-btn:hover {
            transform: translateY(-3px);
            box-shadow: 6px 6px 14px rgba(0, 0, 0, 0.12);
            background: #f0f0f0;
        }

        .option-btn:active {
            transform: translateY(0);
        }

        .option-btn.correct {
            background: #4CAF50;
            color: white;
        }

        .option-btn.wrong {
            background: #f44336;
            color: white;
        }

        .option-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .feedback {
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 10px;
            margin: 10px 0;
            display: none;
        }

        .hint-btn {
            background: #ff9800;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 15px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.1);
            display: none;
        }

        .hint-btn:hover {
            transform: scale(1.05);
        }

        .hint-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .game-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .question-timer-container {
            display: none;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #1e1e2a;
            background: #efe6dd;
            padding: 6px 14px;
            border-radius: 15px;
            box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.06), inset -2px -2px 5px rgba(255, 255, 255, 0.7);
        }

        /* ===== استایل‌های بازی مکان‌یاب ===== */
        .table-container {
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }

        .word-table {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 450px;
            aspect-ratio: 3/2;
        }

        .table-cell {
            background: #ffffff40;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #1e1e2a;
            box-shadow: inset 4px 4px 12px rgba(0, 0, 0, 0.08), inset -4px -4px 12px rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
            padding: 10px;
            text-align: center;
            word-break: break-word;
            cursor: default;
            user-select: none;
        }

        .table-cell.selected-correct {
            background: #4CAF50;
            color: transparent;
            box-shadow: 0 0 25px rgba(76, 175, 80, 0.5);
            transform: scale(1.05);
        }

        .table-cell.selected-wrong {
            background: #f44336;
            color: transparent;
            animation: shake 0.3s ease;
            box-shadow: 0 0 25px rgba(244, 67, 54, 0.5);
        }

        .table-cell.show-correct {
            background: #4CAF50;
            color: transparent;
            box-shadow: 0 0 25px rgba(76, 175, 80, 0.5);
        }

        .table-cell.showing {
            animation: cellPop 0.3s ease;
        }

        .table-cell.hidden-cell {
            background: #ffffff20;
            color: transparent;
            box-shadow: inset 2px 2px 8px rgba(0, 0, 0, 0.05);
        }

        @keyframes cellPop {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-10px);
            }
            75% {
                transform: translateX(10px);
            }
        }

        .question-word {
            text-align: center;
            font-size: 2rem;
            font-weight: 900;
            color: #0a1334;
            padding: 15px;
            margin: 10px 0;
            background: #ffffff40;
            border-radius: 20px;
            box-shadow: inset 2px 2px 6px rgba(0, 0, 0, 0.05);
            display: none;
        }

        .question-word .word-highlight {
            color: #f6681b;
            font-size: 2.2rem;
        }

        .question-progress {
            text-align: center;
            font-size: 1rem;
            color: #666;
            margin: 5px 0;
            display: none;
        }

        .status-message {
            text-align: center;
            font-size: 1.2rem;
            color: #666;
            padding: 10px;
            display: none;
        }

        .round-info {
            text-align: center;
            font-size: 1rem;
            color: #888;
            margin: 5px 0;
            display: none;
        }

        /* ===== استایل‌های بازی واژه‌های آینه‌ای ===== */
        .mirror-container {
            background: #ffffff40;
            border-radius: 25px;
            padding: 40px 20px;
            margin: 15px 0;
            text-align: center;
            box-shadow: inset 4px 4px 12px rgba(0, 0, 0, 0.08), inset -4px -4px 12px rgba(255, 255, 255, 0.6);
            min-height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .mirror-word {
            font-size: 4.5rem;
            font-weight: 900;
            color: #0a1334;
            letter-spacing: 8px;
            user-select: none;
            animation: pulse 1.5s ease-in-out infinite;
            font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
            line-height: 1.4;
            transform: scaleX(-1);
        }

        @keyframes pulse {
            0%,
            100% {
                transform: scaleX(-1) scale(1);
            }
            50% {
                transform: scaleX(-1) scale(1.03);
            }
        }

        .mirror-hint {
            font-size: 0.9rem;
            color: #888;
            margin-top: 10px;
        }

        /* ===== استایل‌های بازی واژه‌ساز ===== */
        .letter-display {
            background: #ffffff40;
            border-radius: 25px;
            padding: 40px 20px;
            margin: 15px 0;
            text-align: center;
            box-shadow: inset 4px 4px 12px rgba(0, 0, 0, 0.08), inset -4px -4px 12px rgba(255, 255, 255, 0.6);
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .letter-box {
            font-size: 4.5rem;
            font-weight: 900;
            color: #0a1334;
            min-width: 80px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            animation: letterPop 0.3s ease;
            text-shadow: 0 0 30px rgba(10, 19, 52, 0.1);
        }

        @keyframes letterPop {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .letter-box.fade-out {
            animation: letterFade 0.3s ease forwards;
        }

        @keyframes letterFade {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(0.5);
                opacity: 0;
            }
        }

        .letter-status {
            font-size: 1rem;
            color: #888;
            margin-top: 10px;
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* ===== ورودی مشترک ===== */
        .input-container {
            display: flex;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .input-container input {
            flex: 1;
            min-width: 200px;
            padding: 15px 20px;
            border: none;
            border-radius: 20px;
            font-size: 1.3rem;
            text-align: center;
            background: #ffffff60;
            box-shadow: inset 4px 4px 12px rgba(0, 0, 0, 0.06), inset -4px -4px 12px rgba(255, 255, 255, 0.7);
            outline: none;
            transition: all 0.3s;
            color: #1e1e2a;
            font-weight: 500;
        }

        .input-container input:focus {
            box-shadow: inset 4px 4px 12px rgba(0, 0, 0, 0.1), inset -4px -4px 12px rgba(255, 255, 255, 0.9);
            background: #ffffff80;
        }

        .input-container input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-container button {
            padding: 15px 35px;
            border: none;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            background: #0a1334;
            color: white;
            transition: all 0.2s;
            box-shadow: 4px 4px 12px rgba(10, 19, 52, 0.3);
            min-width: 120px;
        }

        .input-container button:hover {
            transform: scale(1.05);
            box-shadow: 6px 6px 16px rgba(10, 19, 52, 0.4);
        }

        .input-container button:active {
            transform: scale(0.95);
        }

        .input-container button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== پاپ‌آپ سفارشی ===== */
        .custom-alert-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .custom-alert {
            background: #efe6dd;
            border-radius: 30px;
            padding: 35px 40px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            box-shadow: 20px 20px 40px rgba(0, 0, 0, 0.3), -20px -20px 40px rgba(255, 255, 255, 0.1);
            text-align: center;
            display: flex;
            flex-direction: column;
        }

        .custom-alert .alert-content {
            overflow-y: auto;
            flex: 1;
            padding-right: 5px;
        }

        .custom-alert .alert-content::-webkit-scrollbar {
            width: 5px;
        }

        .custom-alert .alert-content::-webkit-scrollbar-track {
            background: #ddd;
            border-radius: 10px;
        }

        .custom-alert .alert-content::-webkit-scrollbar-thumb {
            background: #0a1334;
            border-radius: 10px;
        }

        .custom-alert .alert-icon {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        .custom-alert .alert-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: #1e1e2a;
            margin-bottom: 15px;
        }

        .custom-alert .alert-message {
            font-size: 1.1rem;
            color: #333;
            line-height: 2;
            margin-bottom: 25px;
            text-align: right;
        }

        .custom-alert .alert-message .highlight {
            color: #9a0002;
            font-weight: bold;
        }

        .custom-alert .alert-message .success-text {
            color: #4CAF50;
            font-weight: bold;
        }

        .custom-alert .alert-message .user-name {
            color: #1433bd;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .custom-alert .alert-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            padding-top: 10px;
            border-top: 2px solid rgba(0, 0, 0, 0.05);
        }

        .custom-alert .alert-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 120px;
        }

        .custom-alert .alert-btn.primary {
            background: #0a1334;
            color: white;
            box-shadow: 4px 4px 12px rgba(10, 19, 52, 0.3);
        }

        .custom-alert .alert-btn.primary:hover {
            transform: scale(1.05);
            box-shadow: 6px 6px 16px rgba(10, 19, 52, 0.4);
        }

        .custom-alert .alert-btn.danger {
            background: #9a0002;
            color: white;
            box-shadow: 4px 4px 12px rgba(154, 0, 2, 0.3);
        }

        .custom-alert .alert-btn.danger:hover {
            transform: scale(1.05);
            box-shadow: 6px 6px 16px rgba(154, 0, 2, 0.4);
        }

        .custom-alert .alert-btn.secondary {
            background: #ddd;
            color: #333;
            box-shadow: 4px 4px 12px rgba(0, 0, 0, 0.1);
        }

        .custom-alert .alert-btn.secondary:hover {
            transform: scale(1.05);
            background: #ccc;
        }

        .custom-alert .alert-btn.success {
            background: #4CAF50;
            color: white;
            box-shadow: 4px 4px 12px rgba(76, 175, 80, 0.3);
        }

        .custom-alert .alert-btn.success:hover {
            transform: scale(1.05);
            box-shadow: 6px 6px 16px rgba(76, 175, 80, 0.4);
        }

        /* ===== ریسپانسیو ===== */
        @media (max-width: 600px) {
            #homePage,
            #gamePage1,
            #gamePage2,
            #gamePage3,
            #gamePage4 {
                padding: 20px 16px 24px;
            }
            .game-title {
                font-size: 1.7rem;
                white-space: normal;
            }
            .games-grid {
                grid-template-columns: 1fr 1fr;
                gap: 14px;
            }

                    const gain = audioContext.createGain();
                    osc.connect(gain);

                    osc.frequency.value = 523.25;
                    osc.type = 'sine';
                    gain.gain.value = 0.3;
                    osc.start();
                    setTimeout(() => { osc.frequency.value = 659.25; }, 100);

                    const gain = audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.frequency.value = 300;
                    osc.type = 'sawtooth';
                    gain.gain.value = 0.2;
                    osc.start();
                    setTimeout(() => { osc.stop(); }, 300);

                playSound('wrong');
                gameState3.lives--;
                updateLivesDisplay3();
                const feedback = document.getElementById('feedback3');
                feedback.textContent = `❌ اشتباه! کلمه صحیح: ${currentWord3}`;
                feedback.style.color = '#f44336';
                feedback.style.display = 'block';
                if (gameState3.lives <= 0) { setTimeout(() => endGame3(false), 1500); return; }
                setTimeout(() => { if (gameState3.isPlaying) generateNewWord3(); }, 1500);
            }
        }

        function startMainTimer3() {
            if (gameState3.timerInterval) clearInterval(gameState3.timerInterval);
            gameState3.timerInterval = setInterval(() => {
                gameState3.timeLeft--;
                updateTimerDisplay3();
                if (gameState3.timeLeft <= 0) endGame3(true);
            }, 1000);
        }

        function updateTimerDisplay3() {
            const m = Math.floor(gameState3.timeLeft / 60);
            const s = gameState3.timeLeft % 60;
            document.getElementById('mainTimer3').textContent = `${m}:${s.toString().padStart(2, '0')}`;
        }

        function updateScoreDisplay3() {
            document.getElementById('scoreDisplay3').textContent = gameState3.score;
        }

        function updateLivesDisplay3() {
            document.getElementById('livesDisplay3').textContent = '❤️'.repeat(Math.max(0, gameState3.lives));
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && document.getElementById('gamePage3').style.display === 'block') {
                if (!document.getElementById('submitBtn3').disabled) {
                    checkAnswer3();
                }
            }
        });

        async function endGame3(byTime) {
            gameState3.isPlaying = false;
            if (gameState3.timerInterval) { clearInterval(gameState3.timerInterval);
                gameState3.timerInterval = null; }

            const finalScore = gameState3.score;
            const accuracy = totalAttempts3 > 0 ? Math.round((finalScore / totalAttempts3) * 100) : 0;

            let icon, title, message, buttons;
            if (gameState3.lives > 0 && finalScore >= 5) {
                playSound('success');
                icon = '🎉';
                title = 'تبریک!';
                message =
                    `🌟 <span class="user-name">${playerName}</span> عزیز، خسته نباشید! این بازی کمک می‌کند کلمات بهتر در ذهن شما ثبت شوند.<br><br>` +
                    `🏆 <b>امتیاز نهایی:</b> <span class="highlight">${finalScore}</span><br>` +
                    `📊 <b>دقت:</b> <span class="success-text">${accuracy}%</span><br>` +
                    `❤️ <b>جان‌های باقی‌مانده:</b> <span class="highlight">${gameState3.lives}</span>`;
                buttons = [{ text: '🏠 بازگشت به خانه', class: 'success' }];
            } else {
                playSound('gameover');
                icon = gameState3.lives <= 0 ? '💔' : '⏰';
                title = gameState3.lives <= 0 ? 'بازی تمام شد!' : 'زمان تمام شد!';
                message =
                    `🌟 <span class="user-name">${playerName}</span> عزیز، خسته نباشید! این بازی کمک می‌کند کلمات بهتر در ذهن شما ثبت شوند.<br><br>` +
                    `🏆 <b>امتیاز نهایی:</b> <span class="highlight">${finalScore}</span><br>` +
                    `📊 <b>دقت:</b> <span class="highlight">${accuracy}%</span>`;
                buttons = [{ text: '🏠 بازگشت به خانه', class: 'primary' }];
            }
            await showCustomAlert(icon, title, message, buttons);
            goHome();
        }

        // ============================================================
        // بازی ۴: واژه‌ساز (کامل)
        // ============================================================
        let gameState4 = {
            score: 0,
            lives: 3,
            timeLeft: 180,
            isPlaying: false,
            timerInterval: null
        };
        let usedWords4 = [];
        let currentWord4 = '';
        let isAnswering4 = false;
        let letterInterval4 = null;
        let totalAttempts4 = 0;

        function showInstructions4() {
            const message =
                '✏️ <span class="highlight">بازی واژه‌ساز</span><br><br>' +
                '📝 <b>قوانین بازی:</b><br>' +
                '• حروف هر کلمه <span class="highlight">یکی یکی</span> و هر <span class="highlight">۱</span> ثانیه نمایش داده می‌شوند<br>' +
                '• هر حرف بعد از نمایش، <span class="highlight">محو</span> می‌شود<br>' +
                '• بعد از پایان نمایش، باید کلمه را به طور <span class="highlight">کامل</span> تایپ کنید<br><br>' +
                '⏱️ <b>زمان:</b> کل بازی <span class="highlight">۳</span> دقیقه<br>' +
                '❤️ <b>جان‌ها:</b> <span class="highlight">۳</span> جان (هر اشتباه ۱ جان کم می‌شود)<br>' +
                '🏆 <b>امتیاز:</b> هر پاسخ صحیح = <span class="highlight">۱</span> امتیاز<br><br>' +
                '💡 <b>نکته:</b> کلمات از لیست واژگان فارسی انتخاب می‌شوند';

            return showCustomAlert('✏️', 'آماده‌اید؟', message, [
                { text: '🚀 شروع کن!', class: 'primary' }
            ]);
        }

        function initializeGame4() {
            gameState4.score = 0;
            gameState4.lives = 3;
            gameState4.timeLeft = 180;
            gameState4.isPlaying = true;
            usedWords4 = [];
            isAnswering4 = false;
            totalAttempts4 = 0;

            document.getElementById('homePage').style.display = 'none';
            document.getElementById('gamePage4').style.display = 'block';

            updateScoreDisplay4();
            updateLivesDisplay4();
            updateTimerDisplay4();

            document.getElementById('feedback4').style.display = 'none';
            document.getElementById('userInput4').value = '';
            document.getElementById('userInput4').disabled = true;
            document.getElementById('submitBtn4').disabled = true;
            document.getElementById('statusMessage4').textContent = '';
            document.getElementById('letterBox4').textContent = '?';
            document.getElementById('letterStatus4').textContent = 'در حال آماده‌سازی...';

            startMainTimer4();
            generateNewWord4();
        }

        function generateNewWord4() {
            if (!gameState4.isPlaying) return;

            let availableWords = allWords.filter(w => !usedWords4.includes(w));
            if (availableWords.length === 0) {
                usedWords4 = [];
                availableWords = allWords;
            }

            const randomIndex = Math.floor(Math.random() * availableWords.length);
            currentWord4 = availableWords[randomIndex];
            usedWords4.push(currentWord4);

            document.getElementById('userInput4').disabled = true;
            document.getElementById('submitBtn4').disabled = true;
            document.getElementById('userInput4').value = '';
            document.getElementById('feedback4').style.display = 'none';
            document.getElementById('statusMessage4').textContent = '';
            isAnswering4 = false;

            showLetters4(currentWord4);
        }

        function showLetters4(word) {
            const letterBox = document.getElementById('letterBox4');
            const letterStatus = document.getElementById('letterStatus4');
            let index = 0;

            letterStatus.textContent = `🔤 نمایش حروف (${index + 1}/${word.length})`;

            if (letterInterval4) {
                clearInterval(letterInterval4);
            }

            letterInterval4 = setInterval(() => {
                if (index >= word.length) {
                    clearInterval(letterInterval4);
                    letterInterval4 = null;
                    letterStatus.textContent = '✅ نمایش کامل شد! کلمه را تایپ کنید';
                    letterBox.textContent = '✨';

                    document.getElementById('userInput4').disabled = false;
                    document.getElementById('submitBtn4').disabled = false;
                    document.getElementById('userInput4').focus();
                    return;
                }

                playSound('tick');
                letterBox.className = 'letter-box';
                letterBox.textContent = word[index];
                letterStatus.textContent = `🔤 نمایش حروف (${index + 1}/${word.length})`;

                setTimeout(() => {
                    letterBox.className = 'letter-box fade-out';
                }, 700);

                index++;
            }, 1000);
        }

        function checkAnswer4() {
            if (isAnswering4 || !gameState4.isPlaying) return;

            const userInput = document.getElementById('userInput4').value.trim();

            if (userInput === '') {
                document.getElementById('statusMessage4').textContent = '⚠️ لطفاً کلمه را وارد کنید!';
                document.getElementById('statusMessage4').style.color = '#f44336';
                return;
            }

            isAnswering4 = true;
            totalAttempts4++;
            document.getElementById('userInput4').disabled = true;
            document.getElementById('submitBtn4').disabled = true;

            if (userInput === currentWord4) {
                playSound('correct');
                gameState4.score++;
                updateScoreDisplay4();

                const feedback = document.getElementById('feedback4');
                feedback.textContent = '✅ درست! 🎉';
                feedback.style.color = '#4CAF50';
                feedback.style.display = 'block';
                document.getElementById('statusMessage4').textContent = '';

                setTimeout(() => {
                    if (gameState4.isPlaying) {
                        generateNewWord4();
                    }
                }, 800);
            } else {
                playSound('wrong');
                gameState4.lives--;
                updateLivesDisplay4();

                const feedback = document.getElementById('feedback4');
                feedback.textContent = `❌ اشتباه! کلمه صحیح: ${currentWord4}`;
                feedback.style.color = '#f44336';
                feedback.style.display = 'block';

                if (gameState4.lives <= 0) {
                    setTimeout(() => endGame4(false), 1500);
                    return;
                }

                setTimeout(() => {
                    if (gameState4.isPlaying) {
                        generateNewWord4();
                    }
                }, 1500);
            }
        }

        function startMainTimer4() {
            if (gameState4.timerInterval) {
                clearInterval(gameState4.timerInterval);
            }

            gameState4.timerInterval = setInterval(() => {
                gameState4.timeLeft--;
                updateTimerDisplay4();

                if (gameState4.timeLeft <= 0) {
                    endGame4(true);
                }
            }, 1000);
        }

        function updateTimerDisplay4() {
            const minutes = Math.floor(gameState4.timeLeft / 60);
            const seconds = gameState4.timeLeft % 60;
            document.getElementById('mainTimer4').textContent =
                `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function updateScoreDisplay4() {
            document.getElementById('scoreDisplay4').textContent = gameState4.score;
        }

        function updateLivesDisplay4() {
            document.getElementById('livesDisplay4').textContent = '❤️'.repeat(Math.max(0, gameState4.lives));
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && document.getElementById('gamePage4').style.display === 'block') {
                if (!document.getElementById('submitBtn4').disabled) {
                    checkAnswer4();
                }
            }
        });

        async function endGame4(byTime) {
            gameState4.isPlaying = false;

            if (letterInterval4) {
                clearInterval(letterInterval4);
                letterInterval4 = null;
            }

            if (gameState4.timerInterval) {
                clearInterval(gameState4.timerInterval);
                gameState4.timerInterval = null;
            }

            const finalScore = gameState4.score;
            const accuracy = totalAttempts4 > 0 ? Math.round((finalScore / totalAttempts4) * 100) : 0;

            let icon, title, message, buttons;

            if (gameState4.lives > 0 && finalScore >= 5) {
                playSound('success');
                icon = '🎉';
                title = 'تبریک!';
                message =
                    `🌟 <span class="user-name">${playerName}</span> عزیز، خسته نباشید! این بازی کمک می‌کند کلمات بهتر در ذهن شما ثبت شوند.<br><br>` +
                    `🏆 <b>امتیاز نهایی:</b> <span class="highlight">${finalScore}</span><br>` +
                    `📊 <b>دقت:</b> <span class="success-text">${accuracy}%</span><br>` +
                    `❤️ <b>جان‌های باقی‌مانده:</b> <span class="highlight">${gameState4.lives}</span>`;
                buttons = [
                    { text: '🏠 بازگشت به خانه', class: 'success' }
                ];
            } else {
                playSound('gameover');
                icon = gameState4.lives <= 0 ? '💔' : '⏰';
                title = gameState4.lives <= 0 ? 'بازی تمام شد!' : 'زمان تمام شد!';
                message =
                    `🌟 <span class="user-name">${playerName}</span> عزیز، خسته نباشید! این بازی کمک می‌کند کلمات بهتر در ذهن شما ثبت شوند.<br><br>` +
                    `🏆 <b>امتیاز نهایی:</b> <span class="highlight">${finalScore}</span><br>` +
                    `📊 <b>دقت:</b> <span class="highlight">${accuracy}%</span>`;
                buttons = [
                    { text: '🏠 بازگشت به خانه', class: 'primary' }
                ];
            }

            await showCustomAlert(icon, title, message, buttons);
            goHome();
        }

        // ============================================================
        // توابع عمومی
        // ============================================================
        function startGame(gameName) {
            const fullName = document.getElementById('fullName').value.trim();
            if (fullName === '') {
                playSound('click');
                alert('لطفاً ابتدا نام و نام خانوادگی خود را وارد کنید.');
                document.getElementById('fullName').focus();
                return;
            }
            playerName = fullName;

            if (gameName === 'واژه‌ی غایب') {
                playSound('click');
                showInstructions1().then(result => {
                    if (result === 0) initializeGame1();
                });
            } else if (gameName === 'مکان‌یاب واژه‌ها') {
                playSound('click');
                showInstructions2().then(result => {
                    if (result === 0) initializeGame2();
                });
            } else if (gameName === 'واژه‌های آینه‌ای') {
                playSound('click');
                showInstructions3().then(result => {
                    if (result === 0) initializeGame3();
                });
            } else if (gameName === 'واژه‌ساز') {
                playSound('click');
                showInstructions4().then(result => {
                    if (result === 0) initializeGame4();
                });
            } else {
                playSound('click');
                alert('بازی "' + gameName + '" در حال توسعه است.\nنام کاربر: ' + fullName);
            }
        }

        async function confirmGoHome(pageId) {
            let isPlaying = false;
            if (pageId === 'gamePage1') isPlaying = gameState1.isPlaying;
            else if (pageId === 'gamePage2') isPlaying = gameState2.isPlaying;
            else if (pageId === 'gamePage3') isPlaying = gameState3.isPlaying;
            else if (pageId === 'gamePage4') isPlaying = gameState4.isPlaying;

            if (!isPlaying) { goHome(); return; }

            playSound('click');
            const result = await showCustomAlert(
                '🏠',
                'بازگشت به خانه',
                '⚠️ <b>توجه:</b> با بازگشت به صفحه اصلی، <span class="highlight">پیشرفت بازی ذخیره نمی‌شود</span>.<br><br>آیا مطمئن هستید که می‌خواهید بازی را ترک کنید؟', [
                    { text: '✅ بله، برگرد', class: 'danger' },
                    { text: '❌ ادامه‌ی بازی', class: 'secondary' }
                ]
            );
            if (result === 0) goHome();
        }

        function goHome() {
            gameState1.isPlaying = false;
            gameState2.isPlaying = false;
            gameState3.isPlaying = false;
            gameState4.isPlaying = false;

            if (gameState1.timerInterval) { clearInterval(gameState1.timerInterval);
                gameState1.timerInterval = null; }
            if (gameState1.questionInterval) { clearInterval(gameState1.questionInterval);
                gameState1.questionInterval = null; }
            if (gameState2.timerInterval) { clearInterval(gameState2.timerInterval);
                gameState2.timerInterval = null; }
            if (gameState2.displayInterval) { clearInterval(gameState2.displayInterval);
                gameState2.displayInterval = null; }
            if (gameState3.timerInterval) { clearInterval(gameState3.timerInterval);
                gameState3.timerInterval = null; }
            if (gameState4.timerInterval) { clearInterval(gameState4.timerInterval);
                gameState4.timerInterval = null; }
            if (letterInterval4) { clearInterval(letterInterval4);
                letterInterval4 = null; }

            document.getElementById('gamePage1').style.display = 'none';
            document.getElementById('gamePage2').style.display = 'none';
            document.getElementById('gamePage3').style.display = 'none';
            document.getElementById('gamePage4').style.display = 'none';
            document.getElementById('homePage').style.display = 'flex';
        }
    </script>
</body>
