<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>بازی حافظه‌ی املایی</title>
    <style>
        /* ===== تمام استایل‌های داخل فایل اصلی ===== */
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif; }
        html,body { height:100%; overflow:hidden; }
        body { background-color:#efe6dd; padding:16px; display:flex; align-items:center; justify-content:center; }

        #homePage { width:100%; max-width:800px; height:fit-content; max-height:98vh; background:#efe6dd; border-radius:35px; padding:28px 30px 32px; box-shadow:12px 12px 24px rgba(0,0,0,0.1), -12px -12px 24px rgba(255,255,255,0.7); display:flex; flex-direction:column; justify-content:center; }
        .game-title { text-align:center; font-size:clamp(1.8rem,5vw,2.5rem); font-weight:900; margin-bottom:22px; background:linear-gradient(45deg,#ff6b6b,#f6681b,#1433bd,#0a1334); background-size:300% 300%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:gradientShift 4s ease-in-out infinite, float 3s ease-in-out infinite; white-space:nowrap; letter-spacing:2px; }
        @keyframes gradientShift { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
        @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }

        .name-box { background-color:#efe6dd; border-radius:30px; padding:10px 20px; margin-bottom:28px; box-shadow:inset 4px 4px 10px rgba(0,0,0,0.06), inset -4px -4px 10px rgba(255,255,255,0.8), 6px 6px 14px rgba(0,0,0,0.08), -6px -6px 14px rgba(255,255,255,0.5); display:flex; align-items:center; justify-content:center; gap:12px; }
        .name-box .user-icon { font-size:1.9rem; line-height:1; filter:drop-shadow(1px 2px 4px rgba(0,0,0,0.1)); }
        .name-box input { background:transparent; border:none; outline:none; padding:14px 10px; border-radius:20px; font-size:1.1rem; width:75%; max-width:340px; caret-color:#9a0002; text-align:center; color:#1e1e2a; font-weight:500; box-shadow:inset 2px 2px 6px rgba(0,0,0,0.06), inset -2px -2px 6px rgba(255,255,255,0.7); transition:box-shadow 0.2s; }
        .name-box input:focus { box-shadow:inset 3px 3px 8px rgba(0,0,0,0.08), inset -3px -3px 8px rgba(255,255,255,0.9); }
        .name-box input::placeholder { color:#7a6a5a; opacity:0.7; font-weight:300; }

        .games-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(155px,1fr)); gap:18px; }
        .game-btn { border:none; cursor:pointer; border-radius:25px; padding:26px 12px; font-size:1.1rem; font-weight:bold; color:#fff; transition:transform 0.15s ease, box-shadow 0.15s ease; box-shadow:8px 8px 16px rgba(0,0,0,0.15), -8px -8px 16px rgba(255,255,255,0.6), inset 2px 2px 6px rgba(255,255,255,0.2), inset -2px -2px 6px rgba(0,0,0,0.1); display:flex; flex-direction:column; align-items:center; gap:6px; line-height:1.3; }
        .game-btn .emoji-big { font-size:2.2rem; display:block; filter:drop-shadow(0 4px 6px rgba(0,0,0,0.15)); }
        .game-btn:hover { transform:translateY(-4px); box-shadow:12px 12px 20px rgba(0,0,0,0.2), -12px -12px 20px rgba(255,255,255,0.7), inset 2px 2px 6px rgba(255,255,255,0.2), inset -2px -2px 6px rgba(0,0,0,0.1); }
        .game-btn:active { transform:translateY(0); box-shadow:inset 4px 4px 8px rgba(0,0,0,0.2), inset -4px -4px 8px rgba(255,255,255,0.3); }
        .btn-1 { background-color:#0a1334; }
        .btn-2 { background-color:#1433bd; }
        .btn-3 { background-color:#cdfc8a; color:#0a1334; }
        .btn-4 { background-color:#f6681b; }

        .game-header { display:flex; justify-content:space-between; align-items:center; background:#ffffff20; padding:12px 18px; border-radius:20px; margin-bottom:20px; box-shadow:inset 2px 2px 6px rgba(0,0,0,0.05), inset -2px -2px 6px rgba(255,255,255,0.8); flex-wrap:wrap; gap:10px; }
        .game-header .stat { display:flex; align-items:center; gap:8px; font-size:1.1rem; font-weight:bold; color:#1e1e2a; background:#efe6dd; padding:6px 14px; border-radius:15px; box-shadow:inset 2px 2px 5px rgba(0,0,0,0.06), inset -2px -2px 5px rgba(255,255,255,0.7); }
        .stat-icon { font-size:1.3rem; }
        .home-btn { background:#9a0002; color:white; border:none; padding:8px 18px; border-radius:15px; font-size:1rem; cursor:pointer; font-weight:bold; transition:all 0.2s; box-shadow:4px 4px 10px rgba(0,0,0,0.15), -4px -4px 10px rgba(255,255,255,0.3); }
        .home-btn:hover { transform:scale(1.05); box-shadow:6px 6px 14px rgba(0,0,0,0.2); }

        #gamePage1,#gamePage2,#gamePage3,#gamePage4 { display:none; width:100%; max-width:800px; height:fit-content; max-height:98vh; background:#efe6dd; border-radius:35px; padding:20px 25px 25px; box-shadow:12px 12px 24px rgba(0,0,0,0.1), -12px -12px 24px rgba(255,255,255,0.7); }

        .words-display { background:#ffffff40; padding:30px 20px; border-radius:25px; margin:15px 0; display:flex; justify-content:center; flex-wrap:wrap; gap:15px; min-height:120px; align-items:center; box-shadow:inset 4px 4px 12px rgba(0,0,0,0.08), inset -4px -4px 12px rgba(255,255,255,0.6); }
        .word-item { background:#0a1334; color:white; padding:12px 20px; border-radius:15px; font-size:1.3rem; font-weight:bold; box-shadow:4px 4px 10px rgba(0,0,0,0.15); animation:popIn 0.3s ease; }
        @keyframes popIn { 0%{transform:scale(0.8); opacity:0;} 100%{transform:scale(1); opacity:1;} }

        .question-text { text-align:center; font-size:1.4rem; font-weight:bold; color:#1e1e2a; margin:15px 0; padding:15px; background:#ffffff30; border-radius:20px; box-shadow:inset 2px 2px 6px rgba(0,0,0,0.05); display:none; }
        .options-container { display:none; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin:15px 0; }
        .option-btn { background:white; border:none; padding:15px 10px; border-radius:18px; font-size:1.1rem; font-weight:bold; cursor:pointer; color:#1e1e2a; transition:all 0.2s; box-shadow:4px 4px 10px rgba(0,0,0,0.08), -4px -4px 10px rgba(255,255,255,0.7); }
        .option-btn:hover { transform:translateY(-3px); box-shadow:6px 6px 14px rgba(0,0,0,0.12); background:#f0f0f0; }
        .option-btn:active { transform:translateY(0); }
        .option-btn.correct { background:#4CAF50; color:white; }
        .option-btn.wrong { background:#f44336; color:white; }
        .option-btn:disabled { opacity:0.7; cursor:not-allowed; }

        .feedback { text-align:center; font-size:1.5rem; font-weight:bold; padding:10px; margin:10px 0; display:none; }
        .hint-btn { background:#ff9800; color:white; border:none; padding:10px 20px; border-radius:15px; font-size:1rem; font-weight:bold; cursor:pointer; transition:all 0.2s; box-shadow:4px 4px 10px rgba(0,0,0,0.1); display:none; }
        .hint-btn:hover { transform:scale(1.05); }
        .hint-btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

        .game-footer { display:flex; justify-content:space-between; align-items:center; margin-top:15px; flex-wrap:wrap; gap:10px; }
        .question-timer-container { display:none; align-items:center; gap:8px; font-size:1.1rem; font-weight:bold; color:#1e1e2a; background:#efe6dd; padding:6px 14px; border-radius:15px; box-shadow:inset 2px 2px 5px rgba(0,0,0,0.06), inset -2px -2px 5px rgba(255,255,255,0.7); }

        .table-container { display:flex; justify-content:center; margin:15px 0; }
        .word-table { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; width:100%; max-width:450px; aspect-ratio:3/2; }
        .table-cell { background:#ffffff40; border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:1.5rem; font-weight:bold; color:#1e1e2a; box-shadow:inset 4px 4px 12px rgba(0,0,0,0.08), inset -4px -4px 12px rgba(255,255,255,0.6); transition:all 0.3s ease; padding:10px; text-align:center; word-break:break-word; cursor:default; user-select:none; }
        .table-cell.selected-correct { background:#4CAF50; color:transparent; box-shadow:0 0 25px rgba(76,175,80,0.5); transform:scale(1.05); }
        .table-cell.selected-wrong { background:#f44336; color:transparent; animation:shake 0.3s ease; box-shadow:0 0 25px rgba(244,67,54,0.5); }
        .table-cell.show-correct { background:#4CAF50; color:transparent; box-shadow:0 0 25px rgba(76,175,80,0.5); }
        .table-cell.showing { animation:cellPop 0.3s ease; }
        .table-cell.hidden-cell { background:#ffffff20; color:transparent; box-shadow:inset 2px 2px 8px rgba(0,0,0,0.05); }
        @keyframes cellPop { 0%{transform:scale(0.8); opacity:0;} 100%{transform:scale(1); opacity:1;} }
        @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-10px);} 75%{transform:translateX(10px);} }

        .question-word { text-align:center; font-size:2rem; font-weight:900; color:#0a1334; padding:15px; margin:10px 0; background:#ffffff40; border-radius:20px; box-shadow:inset 2px 2px 6px rgba(0,0,0,0.05); display:none; }
        .question-word .word-highlight { color:#f6681b; font-size:2.2rem; }
        .question-progress { text-align:center; font-size:1rem; color:#666; margin:5px 0; display:none; }
        .status-message { text-align:center; font-size:1.2rem; color:#666; padding:10px; display:none; }
        .round-info { text-align:center; font-size:1rem; color:#888; margin:5px 0; display:none; }

        .mirror-container { background:#ffffff40; border-radius:25px; padding:40px 20px; margin:15px 0; text-align:center; box-shadow:inset 4px 4px 12px rgba(0,0,0,0.08), inset -4px -4px 12px rgba(255,255,255,0.6); min-height:150px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        .mirror-word { font-size:4.5rem; font-weight:900; color:#0a1334; letter-spacing:8px; user-select:none; animation:pulse 1.5s ease-in-out infinite; font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif; line-height:1.4; transform:scaleX(-1); }
        @keyframes pulse { 0%,100%{transform:scaleX(-1) scale(1);} 50%{transform:scaleX(-1) scale(1.03);} }
        .mirror-hint { font-size:0.9rem; color:#888; margin-top:10px; }

        .letter-display { background:#ffffff40; border-radius:25px; padding:40px 20px; margin:15px 0; text-align:center; box-shadow:inset 4px 4px 12px rgba(0,0,0,0.08), inset -4px -4px 12px rgba(255,255,255,0.6); min-height:150px; display:flex; align-items:center; justify-content:center; position:relative; }
        .letter-box { font-size:4.5rem; font-weight:900; color:#0a1334; min-width:80px; min-height:90px; display:flex; align-items:center; justify-content:center; transition:all 0.3s ease; animation:letterPop 0.3s ease; text-shadow:0 0 30px rgba(10,19,52,0.1); }
        @keyframes letterPop { 0%{transform:scale(0.5); opacity:0;} 50%{transform:scale(1.2);} 100%{transform:scale(1); opacity:1;} }
        .letter-box.fade-out { animation:letterFade 0.3s ease forwards; }
        @keyframes letterFade { 0%{transform:scale(1); opacity:1;} 100%{transform:scale(0.5); opacity:0;} }
        .letter-status { font-size:1rem; color:#888; margin-top:10px; position:absolute; bottom:15px; left:50%; transform:translateX(-50%); }

        .input-container { display:flex; gap:15px; margin:15px 0; flex-wrap:wrap; justify-content:center; }
        .input-container input { flex:1; min-width:200px; padding:15px 20px; border:none; border-radius:20px; font-size:1.3rem; text-align:center; background:#ffffff60; box-shadow:inset 4px 4px 12px rgba(0,0,0,0.06), inset -4px -4px 12px rgba(255,255,255,0.7); outline:none; transition:all 0.3s; color:#1e1e2a; font-weight:500; }
        .input-container input:focus { box-shadow:inset 4px 4px 12px rgba(0,0,0,0.1), inset -4px -4px 12px rgba(255,255,255,0.9); background:#ffffff80; }
        .input-container input:disabled { opacity:0.5; cursor:not-allowed; }
        .input-container button { padding:15px 35px; border:none; border-radius:20px; font-size:1.2rem; font-weight:bold; cursor:pointer; background:#0a1334; color:white; transition:all 0.2s; box-shadow:4px 4px 12px rgba(10,19,52,0.3); min-width:120px; }
        .input-container button:hover { transform:scale(1.05); box-shadow:6px 6px 16px rgba(10,19,52,0.4); }
        .input-container button:active { transform:scale(0.95); }
        .input-container button:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

        .custom-alert-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); backdrop-filter:blur(5px); z-index:1000; justify-content:center; align-items:center; animation:fadeIn 0.3s ease; }
        @keyframes fadeIn { 0%{opacity:0; transform:scale(0.9);} 100%{opacity:1; transform:scale(1);} }
        .custom-alert { background:#efe6dd; border-radius:30px; padding:35px 40px; max-width:500px; width:90%; max-height:80vh; box-shadow:20px 20px 40px rgba(0,0,0,0.3), -20px -20px 40px rgba(255,255,255,0.1); text-align:center; display:flex; flex-direction:column; }
        .custom-alert .alert-content { overflow-y:auto; flex:1; padding-right:5px; }
        .custom-alert .alert-content::-webkit-scrollbar { width:5px; }
        .custom-alert .alert-content::-webkit-scrollbar-track { background:#ddd; border-radius:10px; }
        .custom-alert .alert-content::-webkit-scrollbar-thumb { background:#0a1334; border-radius:10px; }
        .custom-alert .alert-icon { font-size:4rem; margin-bottom:10px; }
        .custom-alert .alert-title { font-size:1.8rem; font-weight:900; color:#1e1e2a; margin-bottom:15px; }
        .custom-alert .alert-message { font-size:1.1rem; color:#333; line-height:2; margin-bottom:25px; text-align:right; }
        .custom-alert .alert-message .highlight { color:#9a0002; font-weight:bold; }
        .custom-alert .alert-message .success-text { color:#4CAF50; font-weight:bold; }
        .custom-alert .alert-message .user-name { color:#1433bd; font-weight:bold; font-size:1.2rem; }
        .custom-alert .alert-buttons { display:flex; gap:15px; justify-content:center; flex-wrap:wrap; padding-top:10px; border-top:2px solid rgba(0,0,0,0.05); }
        .custom-alert .alert-btn { padding:12px 30px; border:none; border-radius:20px; font-size:1.1rem; font-weight:bold; cursor:pointer; transition:all 0.2s; min-width:120px; }
        .custom-alert .alert-btn.primary { background:#0a1334; color:white; box-shadow:4px 4px 12px rgba(10,19,52,0.3); }
        .custom-alert .alert-btn.primary:hover { transform:scale(1.05); box-shadow:6px 6px 16px rgba(10,19,52,0.4); }
        .custom-alert .alert-btn.danger { background:#9a0002; color:white; box-shadow:4px 4px 12px rgba(154,0,2,0.3); }
        .custom-alert .alert-btn.danger:hover { transform:scale(1.05); box-shadow:6px 6px 16px rgba(154,0,2,0.4); }
        .custom-alert .alert-btn.secondary { background:#ddd; color:#333; box-shadow:4px 4px 12px rgba(0,0,0,0.1); }
        .custom-alert .alert-btn.secondary:hover { transform:scale(1.05); background:#ccc; }
        .custom-alert .alert-btn.success { background:#4CAF50; color:white; box-shadow:4px 4px 12px rgba(76,175,80,0.3); }
        .custom-alert .alert-btn.success:hover { transform:scale(1.05); box-shadow:6px 6px 16px rgba(76,175,80,0.4); }

        @media (max-width:600px) {
            #homePage,#gamePage1,#gamePage2,#gamePage3,#gamePage4 { padding:20px 16px 24px; }
            .game-title { font-size:1.7rem; white-space:normal; }
            .games-grid { grid-template-columns:1fr 1fr; gap:14px; }
            .game-btn { padding:20px 8px; font-size:1rem; }
            .game-btn .emoji-big { font-size:1.9rem; }
            .name-box { padding:8px 14px; flex-wrap:wrap; }
            .name-box input { width:100%; font-size:1rem; padding:12px 8px; }
            .game-header { padding:10px 12px; }
            .game-header .stat { font-size:0.9rem; padding:4px 10px; }
            .options-container { grid-template-columns:1fr 1fr; gap:10px; }
            .option-btn { padding:12px 8px; font-size:1rem; }
            .word-item { padding:10px 15px; font-size:1.1rem; }
            .word-table { gap:8px; max-width:350px; }
            .table-cell { font-size:1.1rem; padding:8px; }
            .question-word { font-size:1.5rem; padding:10px; }
            .question-word .word-highlight { font-size:1.7rem; }
            .mirror-word { font-size:3rem; letter-spacing:5px; }
            .letter-box { font-size:3rem; min-width:60px; min-height:70px; }
            .letter-display { padding:30px 15px; min-height:120px; }
            .input-container input { font-size:1.1rem; padding:12px 15px; min-width:150px; }
            .input-container button { padding:12px 25px; font-size:1rem; min-width:90px; }
            .custom-alert { padding:25px 20px; max-height:85vh; }
            .custom-alert .alert-title { font-size:1.4rem; }
            .custom-alert .alert-message { font-size:1rem; }
            .custom-alert .alert-btn { padding:10px 20px; font-size:1rem; min-width:90px; }
        }
        @media (max-width:430px) {
            .games-grid { grid-template-columns:1fr 1fr; gap:12px; }
            .game-btn { padding:16px 6px; font-size:0.9rem; }
            .game-btn .emoji-big { font-size:1.6rem; }
            .options-container { grid-template-columns:1fr 1fr; gap:8px; }
            .option-btn { padding:10px 6px; font-size:0.9rem; }
            .word-table { gap:6px; max-width:280px; }
            .table-cell { font-size:0.9rem; padding:6px; border-radius:12px; }
            .question-word { font-size:1.2rem; }
            .question-word .word-highlight { font-size:1.4rem; }
            .mirror-word { font-size:2.2rem; letter-spacing:3px; }
            .letter-box { font-size:2.5rem; min-width:50px; min-height:60px; }
            .input-container { flex-direction:column; align-items:center; }
            .input-container input { width:100%; min-width:unset; }
            .input-container button { width:100%; }
        }

        /* ===== منوی دایره‌ای ===== */
        :root { --neon-primary:#0ff; --neon-secondary:#f0f; --bg-dark:#121212; }
        .circular-menu { position:fixed; bottom:25px; left:25px; width:60px; height:60px; z-index:9999; }
        .circular-menu .menu-button { position:absolute; top:0; left:0; width:58px; height:58px; border-radius:50%; background-color:var(--bg-dark); color:var(--neon-primary); border:2px solid var(--neon-primary); cursor:pointer; z-index:2; display:flex; justify-content:center; align-items:center; box-shadow:0 0 8px var(--neon-primary), 0 0 15px var(--neon-primary), 0 0 30px var(--neon-primary), inset 0 0 15px rgba(0,255,255,0.2); transition:all 0.4s cubic-bezier(0.68,-0.55,0.27,1.55); -webkit-tap-highlight-color:transparent; }
        .circular-menu .menu-button:focus-visible { outline:3px solid #fff; outline-offset:3px; }
        .circular-menu.active .menu-button { background-color:#1a0a1a; color:var(--neon-secondary); border-color:var(--neon-secondary); transform:rotate(135deg); box-shadow:0 0 10px var(--neon-secondary), 0 0 20px var(--neon-secondary), 0 0 40px var(--neon-secondary), inset 0 0 20px rgba(255,0,255,0.3); }
        .circular-menu .menu-item { position:absolute; top:0; left:0; width:52px; height:52px; border-radius:50%; background-color:#ffffff; color:#2c3e50; box-shadow:0 4px 15px rgba(0,0,0,0.2); display:flex; justify-content:center; align-items:center; opacity:0; transform:scale(0); z-index:-1; text-decoration:none; -webkit-tap-highlight-color:transparent; pointer-events:none; visibility:hidden; }
        .circular-menu.active .menu-item { pointer-events:auto; visibility:visible; }
        .menu-item:focus-visible { outline:3px solid #fff; outline-offset:2px; }
        .menu-item.instagram:hover,.menu-item.instagram:focus-visible { background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); color:white; }
        .menu-item.telegram:hover,.menu-item.telegram:focus-visible { background:#0088cc; color:white; }
        .menu-item.aparat:hover,.menu-item.aparat:focus-visible { background:#ed1c24; color:white; }
        .menu-item.website:hover,.menu-item.website:focus-visible { background:#4facfe; color:white; }
        .menu-item.webapp:hover,.menu-item.webapp:focus-visible { background:#6c5ce7; color:white; }

        .circular-menu.ready.active .menu-item { animation-duration:0.45s; animation-timing-function:cubic-bezier(0.68,-0.55,0.27,1.55); animation-fill-mode:forwards; }
        .circular-menu.ready.active .menu-item:nth-child(1) { animation-name:expand1; animation-delay:0.00s; }
        .circular-menu.ready.active .menu-item:nth-child(2) { animation-name:expand2; animation-delay:0.07s; }
        .circular-menu.ready.active .menu-item:nth-child(3) { animation-name:expand3; animation-delay:0.14s; }
        .circular-menu.ready.active .menu-item:nth-child(4) { animation-name:expand4; animation-delay:0.21s; }
        .circular-menu.ready.active .menu-item:nth-child(5) { animation-name:expand5; animation-delay:0.28s; }
        .circular-menu.ready:not(.active) .menu-item { animation-duration:0.35s; animation-timing-function:ease-in; animation-fill-mode:forwards; }
        .circular-menu.ready:not(.active) .menu-item:nth-child(1) { animation-name:collapse1; animation-delay:0.28s; }
        .circular-menu.ready:not(.active) .menu-item:nth-child(2) { animation-name:collapse2; animation-delay:0.21s; }
        .circular-menu.ready:not(.active) .menu-item:nth-child(3) { animation-name:collapse3; animation-delay:0.14s; }
        .circular-menu.ready:not(.active) .menu-item:nth-child(4) { animation-name:collapse4; animation-delay:0.07s; }
        .circular-menu.ready:not(.active) .menu-item:nth-child(5) { animation-name:collapse5; animation-delay:0.00s; }

        // ===== توابع صدا =====
        function playSound(type) {
            try {
                const audioContext = new(window.AudioContext || window.webkitAudioContext)();
                if (type === 'correct') {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain); gain.connect(audioContext.destination);
                    osc.frequency.value = 523.25; osc.type = 'sine'; gain.gain.value = 0.3;
                    osc.start();
                    setTimeout(() => { osc.frequency.value = 659.25; }, 100);
                    setTimeout(() => { osc.frequency.value = 783.99; }, 200);
                    setTimeout(() => { osc.stop(); }, 400);
                } else if (type === 'wrong') {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain); gain.connect(audioContext.destination);
                    osc.frequency.value = 300; osc.type = 'sawtooth'; gain.gain.value = 0.2;
                    osc.start();
                    setTimeout(() => { osc.stop(); }, 300);
                } else if (type === 'click') {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain); gain.connect(audioContext.destination);
                    osc.frequency.value = 800; osc.type = 'sine'; gain.gain.value = 0.15;
                    osc.start();
                    setTimeout(() => { osc.stop(); }, 80);
                } else if (type === 'hint') {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain); gain.connect(audioContext.destination);
                    osc.frequency.value = 440; osc.type = 'sine'; gain.gain.value = 0.2;
                    osc.start();
                    setTimeout(() => { osc.frequency.value = 554.37; }, 150);
                    setTimeout(() => { osc.stop(); }, 300);
                } else if (type === 'gameover') {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain); gain.connect(audioContext.destination);
                    osc.frequency.value = 400; osc.type = 'square'; gain.gain.value = 0.15;
                    osc.start();
                    setTimeout(() => { osc.frequency.value = 300; }, 200);
                    setTimeout(() => { osc.frequency.value = 200; }, 400);
                    setTimeout(() => { osc.stop(); }, 600);
                } else if (type === 'success') {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain); gain.connect(audioContext.destination);
                    osc.frequency.value = 523.25; osc.type = 'sine'; gain.gain.value = 0.2;
                    osc.start();
                    setTimeout(() => { osc.frequency.value = 659.25; }, 150);
                    setTimeout(() => { osc.frequency.value = 783.99; }, 300);
                    setTimeout(() => { osc.frequency.value = 1046.50; }, 450);
                    setTimeout(() => { osc.stop(); }, 600);
                } else if (type === 'tick') {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain); gain.connect(audioContext.destination);
                    osc.frequency.value = 600; osc.type = 'sine'; gain.gain.value = 0.08;
                    osc.start();
                    setTimeout(() => { osc.stop(); }, 50);

        function showCustomAlert(icon, title, message, buttons) {
            return new Promise((resolve) => {
                const overlay = document.getElementById('customAlert');
                document.getElementById('alertIcon').textContent = icon;
                document.getElementById('alertTitle').textContent = title;
                document.getElementById('alertMessage').innerHTML = message;
                const buttonsContainer = document.getElementById('alertButtons');
                buttonsContainer.innerHTML = '';
                buttons.forEach((btn, index) => {
                    const button = document.createElement('button');
                    button.className = `alert-btn ${btn.class}`;
                    button.textContent = btn.text;
                    button.onclick = () => { overlay.style.display = 'none'; resolve(index); };
                    buttonsContainer.appendChild(button);
                });
                overlay.style.display = 'flex';
            });
        }

        // ============================================================
        // اسکریپت منوی دایره‌ای

        (function() {
            const menu = document.getElementById('circularMenu');
            const menuButton = document.querySelector('.menu-button');
            const menuItems = Array.from(document.querySelectorAll('.menu-item'));
            let isMenuOpen = false;
            let isInitialized = false;
            let isAnimating = false;
            const ANIMATION_LOCK_MS = 730;

            function setMenuState(open) {
                isMenuOpen = open;
                menu.classList.toggle('active', open);
                menuButton.setAttribute('aria-expanded', String(open));
                menuItems.forEach(item => item.setAttribute('tabindex', open ? '0' : '-1'));
            }

            function toggleMenu() {
                if (isAnimating) return;
                if (!isInitialized) { menu.classList.add('ready'); isInitialized = true; }
                isAnimating = true;
                setMenuState(!isMenuOpen);
                setTimeout(() => { isAnimating = false; }, ANIMATION_LOCK_MS);
            }

            menuButton.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleMenu();
            });

            document.addEventListener('click', function(e) {
                if (isMenuOpen && !menu.contains(e.target)) setMenuState(false);
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && isMenuOpen) { setMenuState(false); menuButton.focus(); }
            });

            menu.addEventListener('click', function(e) { e.stopPropagation(); });
        })();
