<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>املای دوست داشتنی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&family=Baloo+Bhaijaan+2:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin:0; padding:0; }

  body {
    font-family:'Vazirmatn',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #74ebd5, #9face6);
    flex-direction:column;
  }

  .container { text-align:center; width:90%; max-width:900px; }

  .title {
    font-family: 'Baloo Bhaijaan 2','B Titr','BTitr','Vazirmatn',sans-serif;
    font-size:2rem;
    font-weight:700;
    color:#fff;
    margin-bottom:40px;
    display:inline-block;
    animation: wordPop 1.6s ease-out forwards;
  }
  @keyframes wordPop {
    0% {opacity:0; transform:scale(0.6) translateY(-20px); letter-spacing:0;}
    60% {opacity:1; transform:scale(1.05) translateY(5px); letter-spacing:6px;}
    100% {opacity:1; transform:scale(1) translateY(0); letter-spacing:2px;}
  }

  .cards {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:25px;
  }

  .card {
    padding:25px 20px;
    border-radius:20px;
    color:#fff;
    cursor:pointer;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    transition: transform 0.3s, box-shadow 0.3s;
  }
  .card:hover { transform:translateY(-8px) scale(1.03); box-shadow:0 15px 35px rgba(0,0,0,0.3); }
  .card h2 { margin:0 0 10px 0; font-size:1.6rem; }
  .card p { margin:0; font-size:0.95rem; opacity:0.95; }

  .card.one   { background: linear-gradient(135deg, #ff9a9e, #fad0c4); }
  .card.two   { background: linear-gradient(135deg, #a18cd1, #fbc2eb); }

  .game-section { 
    display:none; 
    width:100%; 
    max-width:600px; 
    text-align:center; 
    margin-top:20px;
    padding:20px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    backdrop-filter: blur(10px);
  }

  .status-bar {
    display:flex;
    justify-content:space-around;
    margin-bottom:20px;
  }
  .status-bar div {
    padding:10px 15px;
    border-radius:10px;
    font-weight:700;
    min-width:60px;
    text-align:center;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
  }
  #wm-time{background:#ff9800;} #wm-score{background:#ffd700;} #wm-life{background:#f44336;}
  #ml-time{background:#ff9800;} #ml-score{background:#ffd700;} #ml-life{background:#f44336;}

  .letters-container, .letter-box, #wm-letters, #ml-letterContainer, .options {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
  }
  .letter-box {
    width:50px; height:50px;
    background: rgba(255,255,255,0.3);
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:1.5rem;
    font-weight:700;
    opacity:0;
    animation: fadeIn 0.5s forwards;
  }
  @keyframes fadeIn { from{opacity:0; transform:translateY(-20px);} to{opacity:1; transform:translateY(0);} }

  .input-container { margin-top:20px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .input-container input { 
    padding:10px; 
    border-radius:10px; 
    border:none; 
    font-size:1.2rem; 
    text-align:center;
    font-family: 'Vazirmatn', sans-serif;
    width:100%;
    max-width:300px;
  }
  .input-container button { 
    padding:10px 20px; 
    border-radius:10px; 
    border:none; 
    background:#fff; 
    font-weight:700; 
    cursor:pointer; 
    transition:0.3s;
    font-family: 'Vazirmatn', sans-serif;
  }
  .input-container button:hover { background:#eee; }

  .option-btn { 
    padding:10px 20px; 
    border:none; 
    border-radius:10px; 
    font-size:1.2rem; 
    cursor:pointer; 
    font-weight:700; 
    transition:0.3s;
    font-family: 'Vazirmatn', sans-serif;
  }
  .option-btn:hover { background:#eee; }

  .result-message { 
    margin-top:20px; 
    font-size:1.2rem; 
    font-weight:700; 
    color:#fff;
    padding:10px;
    border-radius:10px;
    min-height:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: all 0.3s;
  }
  @keyframes correctFlash {
    0% { transform: scale(1); background: #4caf50; }
    50% { transform: scale(1.05); background: #66bb6a; }
    100% { transform: scale(1); background: #4caf50; }
  }
  @keyframes wrongShake {
    0% { transform: translateX(0); background: #f44336; }
    25% { transform: translateX(-10px); background: #ef5350; }
    50% { transform: translateX(10px); background: #f44336; }
    75% { transform: translateX(-5px); background: #ef5350; }
    100% { transform: translateX(0); background: #f44336; }
  }
  .result-message.correct {
    animation: correctFlash 0.6s ease;
    background: #4caf50!important;
    color:#fff;
  }
  .result-message.wrong {
    animation: wrongShake 0.5s ease;
    background: #f44336!important;
    color:#fff;
  }

  .end-buttons { margin-top:20px; display:flex; gap:15px; justify-content:center; }
  .end-buttons button { 
    padding:10px 20px; 
    border-radius:10px; 
    border:none; 
    cursor:pointer; 
    font-weight:700;
    font-family: 'Vazirmatn', sans-serif;
  }

  #ml-letterContainer {
    font-size: 2rem;
    padding: 20px;
    margin: 20px 0;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 15px;
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #confettiContainer{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:999;
    overflow:hidden;
  }
  .confettiPiece{
    position:absolute;
    width:10px;
    height:10px;
    border-radius:2px;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall{
    0%{ transform: translateY(-10vh) rotate(0deg); opacity:1; }
    100%{ transform: translateY(110vh) rotate(720deg); opacity:0; }
  }

  /* ===== استایل‌های منوی شبکه‌های اجتماعی ===== */
  :root {
    --neon-primary: #0ff;
    --neon-secondary: #f0f;
    --bg-dark: #121212;
  }

  .circular-menu {
    position: fixed;
    bottom: 25px;
    left: 25px;
    width: 60px;
    height: 60px;
    z-index: 9999;
  }

  .circular-menu .menu-button {
    position: absolute;
    top: 0; left: 0;
    width: 58px; height: 58px;
    border-radius: 50%;
    background-color: var(--bg-dark);
    color: var(--neon-primary);
    border: 2px solid var(--neon-primary);
    cursor: pointer;
    z-index: 2;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 0 8px var(--neon-primary),
                0 0 15px var(--neon-primary),
                0 0 30px var(--neon-primary),
                inset 0 0 15px rgba(0, 255, 255, 0.2);
    transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    -webkit-tap-highlight-color: transparent;
  }

  .circular-menu .menu-button:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 3px;
  }

  .circular-menu.active .menu-button {
    background-color: #1a0a1a;
    color: var(--neon-secondary);
    border-color: var(--neon-secondary);
    transform: rotate(135deg);
    box-shadow: 0 0 10px var(--neon-secondary),
                0 0 20px var(--neon-secondary),
                0 0 40px var(--neon-secondary),
                inset 0 0 20px rgba(255, 0, 255, 0.3);
  }

  .circular-menu .menu-item {
    position: absolute;
    top: 0; left: 0;
    width: 52px; height: 52px;
    border-radius: 50%;
    background-color: #ffffff;
    color: #2c3e50;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    transform: scale(0);
    z-index: -1;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    pointer-events: none;
    visibility: hidden;
  }

  .circular-menu.active .menu-item {
    pointer-events: auto;
    visibility: visible;
  }

  .menu-item:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 2px;
  }

  .menu-item.instagram:hover, .menu-item.instagram:focus-visible { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: white; }
  .menu-item.telegram:hover, .menu-item.telegram:focus-visible { background: #0088cc; color: white; }
  .menu-item.aparat:hover, .menu-item.aparat:focus-visible { background: #ed1c24; color: white; }
  .menu-item.website:hover, .menu-item.website:focus-visible { background: #4facfe; color: white; }
  .menu-item.webapp:hover, .menu-item.webapp:focus-visible { background: #6c5ce7; color: white; }

  .circular-menu.ready.active .menu-item {
    animation-duration: 0.45s;
    animation-timing-function: cubic-bezier(0.68, -0.55, 0.27, 1.55);
    animation-fill-mode: forwards;
  }
  .circular-menu.ready.active .menu-item:nth-child(1) { animation-name: expand1; animation-delay: 0.00s; }
  .circular-menu.ready.active .menu-item:nth-child(2) { animation-name: expand2; animation-delay: 0.07s; }
  .circular-menu.ready.active .menu-item:nth-child(3) { animation-name: expand3; animation-delay: 0.14s; }
  .circular-menu.ready.active .menu-item:nth-child(4) { animation-name: expand4; animation-delay: 0.21s; }
  .circular-menu.ready.active .menu-item:nth-child(5) { animation-name: expand5; animation-delay: 0.28s; }

  .circular-menu.ready:not(.active) .menu-item {
    animation-duration: 0.35s;
    animation-timing-function: ease-in;
    animation-fill-mode: forwards;
  }
  .circular-menu.ready:not(.active) .menu-item:nth-child(1) { animation-name: collapse1; animation-delay: 0.28s; }
  .circular-menu.ready:not(.active) .menu-item:nth-child(2) { animation-name: collapse2; animation-delay: 0.21s; }
  .circular-menu.ready:not(.active) .menu-item:nth-child(3) { animation-name: collapse3; animation-delay: 0.14s; }
  .circular-menu.ready:not(.active) .menu-item:nth-child(4) { animation-name: collapse4; animation-delay: 0.07s; }
  .circular-menu.ready:not(.active) .menu-item:nth-child(5) { animation-name: collapse5; animation-delay: 0.00s; }

  @keyframes expand1 { 0% { opacity:0; transform:scale(0); z-index:1; } 100% { opacity:1; transform:translate(0,-150px) scale(1); z-index:1; } }
  @keyframes expand2 { 0% { opacity:0; transform:scale(0); z-index:1; } 100% { opacity:1; transform:translate(57px,-139px) scale(1); z-index:1; } }
  @keyframes expand3 { 0% { opacity:0; transform:scale(0); z-index:1; } 100% { opacity:1; transform:translate(106px,-106px) scale(1); z-index:1; } }
  @keyframes expand4 { 0% { opacity:0; transform:scale(0); z-index:1; } 100% { opacity:1; transform:translate(139px,-57px) scale(1); z-index:1; } }
  @keyframes expand5 { 0% { opacity:0; transform:scale(0); z-index:1; } 100% { opacity:1; transform:translate(150px,0) scale(1); z-index:1; } }

  @keyframes collapse1 { 0% { opacity:1; transform:translate(0,-150px) scale(1); z-index:1; } 100% { opacity:0; transform:translate(0,-150px) scale(0); z-index:-1; } }
  @keyframes collapse2 { 0% { opacity:1; transform:translate(57px,-139px) scale(1); z-index:1; } 100% { opacity:0; transform:translate(57px,-139px) scale(0); z-index:-1; } }
  @keyframes collapse3 { 0% { opacity:1; transform:translate(106px,-106px) scale(1); z-index:1; } 100% { opacity:0; transform:translate(106px,-106px) scale(0); z-index:-1; } }
  @keyframes collapse4 { 0% { opacity:1; transform:translate(139px,-57px) scale(1); z-index:1; } 100% { opacity:0; transform:translate(139px,-57px) scale(0); z-index:-1; } }
  @keyframes collapse5 { 0% { opacity:1; transform:translate(150px,0) scale(1); z-index:1; } 100% { opacity:0; transform:translate(150px,0) scale(0); z-index:-1; } }

  .circular-menu svg { width: 24px; height: 24px; fill: currentColor; }
</style>
</head>

<script>
// ===== اسکریپت بازی =====
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playTone(freq, duration, type='sine', volume=0.3){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);

function launchConfetti(count=80){
    const container = document.getElementById('confettiContainer');
    container.innerHTML = '';
    const colors = ['#ff0','#f0f','#0ff','#f00','#0f0','#00f','#ffa500','#ff69b4'];
    for(let i=0; i<count; i++){
        const piece = document.createElement('div');
        piece.className = 'confettiPiece';
        const size = Math.random()*8 + 4;
        const left = Math.random()*100;
        const delay = Math.random()*2;
        const duration = Math.random()*2 + 2;
        const color = colors[Math.floor(Math.random()*colors.length)];
        Object.assign(piece.style, {
            left: left+'%',
            width: size+'px',
            height: size*0.6+'px',
            background: color,
            animationDuration: duration+'s',
            animationDelay: delay+'s',
            borderRadius: Math.random()>0.5 ? '50%' : '2px'
        });
        container.appendChild(piece);
    }
    setTimeout(()=>container.innerHTML='', 5000);
}

let wm_currentWord='', wm_score=0, wm_life=3, wm_time=100, wm_timer;

function shuffleString(str){ return str.split('').sort(()=>Math.random()-0.5).join(''); }

function startWordmaker(){
  wm_gameActive = true;
  wm_score=0; wm_life=3; wm_time=100;
  document.getElementById('wm-scoreValue').innerText = wm_score;
  document.getElementById('wm-lifeValue').innerText = wm_life;
  document.getElementById('wm-timeValue').innerText = wm_time;
  document.getElementById('wm-result').innerText = '';
  document.getElementById('wm-result').className = 'result-message';
  document.getElementById('wm-endButtons').style.display = 'none';
  document.getElementById('wm-submitBtn').disabled = false;
  nextWordmaker();
  if(wm_timer) clearInterval(wm_timer);
  wm_timer = setInterval(() => {
    if (!wm_gameActive) { clearInterval(wm_timer); return; }
    wm_time--;
    document.getElementById('wm-timeValue').innerText = wm_time;
    if(wm_time <= 0) endWordmaker();
  }, 1000);
}

function nextWordmaker(){
  if (!wm_gameActive) return;
  let index = Math.floor(Math.random() * wm_words.length);
  wm_currentWord = wm_words[index];
  let scrambled = shuffleString(wm_currentWord);
  let lettersContainer = document.getElementById('wm-letters');
  lettersContainer.innerHTML = '';
  for(let i = 0; i < scrambled.length; i++){
    let box = document.createElement('div');
    box.className = 'letter-box';
    box.innerText = scrambled[i];
    box.style.animationDelay = (i * 0.2) + 's';
    lettersContainer.appendChild(box);
  }
  document.getElementById('wm-answer').value = '';
  document.getElementById('wm-submitBtn').disabled = false;
}

function checkWordmaker(){
  if (!wm_gameActive) return;
  let ans = document.getElementById('wm-answer').value.trim();
  let result = document.getElementById('wm-result');
  if(ans === wm_currentWord){
    wm_score++;
    document.getElementById('wm-scoreValue').innerText = wm_score;
    result.innerText = '✔ پاسخ درست!';
    result.className = 'result-message correct';
    playCorrectSound();
  } else {
    wm_life--;
    document.getElementById('wm-lifeValue').innerText = wm_life;
    result.innerText = '✖ پاسخ اشتباه! پاسخ درست: ' + wm_currentWord;
    result.className = 'result-message wrong';
    playWrongSound();
  }
  document.getElementById('wm-submitBtn').disabled = true;
  if(wm_life <= 0){ 
    setTimeout(endWordmaker, 800);
  } else { 
    setTimeout(() => { 
      if (wm_gameActive) {
        result.className = 'result-message';
        result.innerText = '';
        nextWordmaker();
      }
    }, 900);
  }
}

function endWordmaker(){
  wm_gameActive = false;
  clearInterval(wm_timer);
  document.getElementById('wm-letters').innerHTML = '';
  document.getElementById('wm-result').innerText = 'خسته نباشید! امتیاز شما: ' + wm_score;
  document.getElementById('wm-result').className = 'result-message';
  document.getElementById('wm-endButtons').style.display = 'flex';
  document.getElementById('wm-submitBtn').disabled = true;
  playFinishSound();
  launchConfetti(100);
}

// ===== اسکریپت منوی شبکه‌های اجتماعی =====
(function() {
  const menu = document.getElementById('circularMenu');
  const menuButton = document.querySelector('.menu-button');
  const menuItems = Array.from(document.querySelectorAll('.menu-item'));
  let isMenuOpen = false;
  let isInitialized = false;
  let isAnimating = false;
  const ANIMATION_LOCK_MS = 730;

  function setMenuState(open) {
    isMenuOpen = open;
    menu.classList.toggle('active', open);
    menuButton.setAttribute('aria-expanded', String(open));
    menuItems.forEach(item => item.setAttribute('tabindex', open ? '0' : '-1'));
  }

  function toggleMenu() {
    if (isAnimating) return;
    if (!isInitialized) {
      menu.classList.add('ready');
      isInitialized = true;
    }
    isAnimating = true;
    setMenuState(!isMenuOpen);
    setTimeout(() => { isAnimating = false; }, ANIMATION_LOCK_MS);
  }

  menuButton.addEventListener('click', function(e) {
    e.stopPropagation();
    toggleMenu();
  });

  document.addEventListener('click', function(e) {
    if (isMenuOpen && !menu.contains(e.target)) {
      setMenuState(false);
    }
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && isMenuOpen) {
      setMenuState(false);
      menuButton.focus();
    }
  });

  menu.addEventListener('click', function(e) {
    e.stopPropagation();
  });
})();
