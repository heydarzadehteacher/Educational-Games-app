<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بازی مساحت اشکال هندسی</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    margin: 0;
    padding: 20px;
    font-family: 'Baloo 2', cursive;
    background: linear-gradient(135deg, #0a192f, #1e3a5f, #2c3e50);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
}

.container {
    background-color: #ffffff;
    border-radius: 25px;
    padding: 20px;
    width: 90%;
    max-width: 540px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.3);
    text-align: center;
    position: relative;
    overflow: hidden;
}

h1 {
    color: #4a90e2;
    font-size: 26px;
    margin-bottom: 10px;
    text-shadow: 2px 2px #e8f4ff;
}

#status {
    display: flex;
    justify-content: space-around;
    margin-bottom: 10px;
}
.status-box {
    background: linear-gradient(135deg, #4a90e2, #63b3ed);
    padding: 5px 10px;
    border-radius: 10px;
    min-width: 80px;
    font-weight: bold;
    color: white;
    box-shadow: 0 3px 6px rgba(0,0,0,0.1);
}

canvas {
    border: 3px solid #4a90e2;
    border-radius: 15px;
    background: linear-gradient(135deg, #f8f9fa, #e9ecef);
    margin-bottom: 10px;
    width: 100%;
    height: auto;
    max-height: 380px;
    transition: border-color 0.4s;
    display: block;
}
canvas.correct-flash {
    border-color: #27ae60 !important;
    box-shadow: 0 0 30px rgba(46, 204, 113, 0.4);
}
canvas.wrong-flash {
    border-color: #e74c3c !important;
    box-shadow: 0 0 30px rgba(231, 76, 60, 0.4);
}

#info {
    font-size: 20px;
    color: #2d3748;
    margin-bottom: 10px;
    font-weight: bold;
    background: #edf2f7;
    padding: 8px;
    border-radius: 10px;
}

input {
    font-size: 18px;
    padding: 10px;
    border-radius: 15px;
    border: 2px solid #4a90e2;
    width: 60%;
    text-align: center;
    margin-bottom: 10px;
    background: #f7fafc;
    transition: all 0.3s;
}
input:focus {
    outline: none;
    border-color: #2ecc71;
    box-shadow: 0 0 15px rgba(46, 204, 113, 0.2);
}
input.shake {
    animation: shake 0.5s ease-in-out;
    border-color: #e74c3c !important;
    background-color: #ffeaea !important;
}

#result {
    font-size: 18px;
    font-weight: bold;
    margin-top: 10px;
    min-height: 24px;
    padding: 5px;
    border-radius: 8px;
    transition: all 0.3s;
}

#restartBtn {
    display: none;
    font-size: 18px;
    padding: 10px 20px;
    border-radius: 20px;
    border: none;
    background: linear-gradient(135deg, #4a90e2, #63b3ed);
    color: white;
    margin-top: 15px;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 4px 8px rgba(74,144,226,0.3);
}
#restartBtn:hover {
    background: linear-gradient(135deg, #357abd, #4a90e2);
    transform: scale(1.05);
}

/* ===== انیمیشن‌ها ===== */
#confettiContainer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1000;
    overflow: hidden;
}
.confetti {
    position: absolute;
    width: 10px;
    height: 10px;
    animation: confettiFall linear forwards;
}
@keyframes confettiFall {
    0% { transform: translateY(-10vh) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg) scale(0.3); opacity: 0; }
}

.correct-popup {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 120px;
    color: #27ae60;
    animation: popUp 0.8s ease-out forwards;
    pointer-events: none;
    z-index: 50;
    text-shadow: 0 0 30px rgba(46, 204, 113, 0.6);
}
@keyframes popUp {
    0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
    50% { transform: translate(-50%, -60%) scale(1.3); opacity: 0.9; }
    70% { transform: translate(-50%, -50%) scale(0.9); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
}

.wrong-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 100;
    pointer-events: none;
    border-radius: 25px;
}
.wrong-overlay.show {
    display: flex;
}
.wrong-sign {
    font-size: 120px;
    color: #e74c3c;
    animation: wrongPulse 0.8s ease-out;
    text-shadow: 0 0 30px rgba(231, 76, 60, 0.7);
}
@keyframes wrongPulse {
    0% { transform: scale(0.3) rotate(-20deg); opacity: 0; }
    50% { transform: scale(1.2) rotate(5deg); opacity: 0.9; }
    70% { transform: scale(0.95) rotate(-3deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
}
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
    20%, 40%, 60%, 80% { transform: translateX(5px); }
}

@media (max-width: 480px) {
    .container { padding: 15px; }
    h1 { font-size: 22px; }
    .status-box { min-width: 60px; font-size: 12px; padding: 4px 8px; }
    input { font-size: 16px; width: 80%; }
    .wrong-sign { font-size: 80px; }
    .correct-popup { font-size: 80px; }
    canvas { max-height: 250px; }
}

/* ===== استایل‌های منوی شبکه‌های اجتماعی ===== */
:root {
    --neon-primary: #0ff;
    --neon-secondary: #f0f;
    --bg-dark: #121212;
}

.circular-menu {
    position: fixed;
    bottom: 25px;
    left: 25px;
    width: 60px;
    height: 60px;
    z-index: 9999;
}

.circular-menu .menu-button {
    position: absolute;
    top: 0; left: 0;
    width: 58px; height: 58px;
    border-radius: 50%;
    background-color: var(--bg-dark);
    color: var(--neon-primary);
    border: 2px solid var(--neon-primary);
    cursor: pointer;
    z-index: 2;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 0 8px var(--neon-primary),
                0 0 15px var(--neon-primary),
                0 0 30px var(--neon-primary),
                inset 0 0 15px rgba(0, 255, 255, 0.2);
    transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    -webkit-tap-highlight-color: transparent;
}

.circular-menu .menu-button:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 3px;
}

.circular-menu.active .menu-button {
    background-color: #1a0a1a;
    color: var(--neon-secondary);
    border-color: var(--neon-secondary);
    transform: rotate(135deg);
    box-shadow: 0 0 10px var(--neon-secondary),
                0 0 20px var(--neon-secondary),
                0 0 40px var(--neon-secondary),
                inset 0 0 20px rgba(255, 0, 255, 0.3);
}

.circular-menu .menu-item {
    position: absolute;
    top: 0; left: 0;
    width: 52px; height: 52px;
    border-radius: 50%;
    background-color: #ffffff;
    color: #2c3e50;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    transform: scale(0);
    z-index: -1;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    pointer-events: none;
    visibility: hidden;
}

.circular-menu.active .menu-item {
    pointer-events: auto;
    visibility: visible;
}

.menu-item:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 2px;
}

.menu-item.instagram:hover, .menu-item.instagram:focus-visible { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: white; }
.menu-item.telegram:hover, .menu-item.telegram:focus-visible { background: #0088cc; color: white; }
.menu-item.aparat:hover, .menu-item.aparat:focus-visible { background: #ed1c24; color: white; }
.menu-item.website:hover, .menu-item.website:focus-visible { background: #4facfe; color: white; }
.menu-item.webapp:hover, .menu-item.webapp:focus-visible { background: #6c5ce7; color: white; }

.circular-menu.ready.active .menu-item {
    animation-duration: 0.45s;
    animation-timing-function: cubic-bezier(0.68, -0.55, 0.27, 1.55);
    animation-fill-mode: forwards;
}
.circular-menu.ready.active .menu-item:nth-child(1) { animation-name: expand1; animation-delay: 0.00s; }
.circular-menu.ready.active .menu-item:nth-child(2) { animation-name: expand2; animation-delay: 0.07s; }
.circular-menu.ready.active .menu-item:nth-child(3) { animation-name: expand3; animation-delay: 0.14s; }
.circular-menu.ready.active .menu-item:nth-child(4) { animation-name: expand4; animation-delay: 0.21s; }
.circular-menu.ready.active .menu-item:nth-child(5) { animation-name: expand5; animation-delay: 0.28s; }

.circular-menu.ready:not(.active) .menu-item {
    animation-duration: 0.35s;
    animation-timing-function: ease-in;
    animation-fill-mode: forwards;
}
.circular-menu.ready:not(.active) .menu-item:nth-child(1) { animation-name: collapse1; animation-delay: 0.28s; }
.circular-menu.ready:not(.active) .menu-item:nth-child(2) { animation-name: collapse2; animation-delay: 0.21s; }
.circular-menu.ready:not(.active) .menu-item:nth-child(3) { animation-name: collapse3; animation-delay: 0.14s; }
.circular-menu.ready:not(.active) .menu-item:nth-child(4) { animation-name: collapse4; animation-delay: 0.07s; }
.circular-menu.ready:not(.active) .menu-item:nth-child(5) { animation-name: collapse5; animation-delay: 0.00s; }

@keyframes expand1 { 0% { opacity:0; transform:scale(0); z-index:1; } 100% { opacity:1; transform:translate(0,-150px) scale(1); z-index:1; } }
@keyframes expand2 { 0% { opacity:0; transform:scale(0); z-index:1; } 100% { opacity:1; transform:translate(57px,-139px) scale(1); z-index:1; } }
@keyframes expand3 { 0% { opacity:0; transform:scale(0); z-index:1; } 100% { opacity:1; transform:translate(106px,-106px) scale(1); z-index:1; } }
@keyframes expand4 { 0% { opacity:0; transform:scale(0); z-index:1; } 100% { opacity:1; transform:translate(139px,-57px) scale(1); z-index:1; } }
@keyframes expand5 { 0% { opacity:0; transform:scale(0); z-index:1; } 100% { opacity:1; transform:translate(150px,0) scale(1); z-index:1; } }

@keyframes collapse1 { 0% { opacity:1; transform:translate(0,-150px) scale(1); z-index:1; } 100% { opacity:0; transform:translate(0,-150px) scale(0); z-index:-1; } }
@keyframes collapse2 { 0% { opacity:1; transform:translate(57px,-139px) scale(1); z-index:1; } 100% { opacity:0; transform:translate(57px,-139px) scale(0); z-index:-1; } }
@keyframes collapse3 { 0% { opacity:1; transform:translate(106px,-106px) scale(1); z-index:1; } 100% { opacity:0; transform:translate(106px,-106px) scale(0); z-index:-1; } }
@keyframes collapse4 { 0% { opacity:1; transform:translate(139px,-57px) scale(1); z-index:1; } 100% { opacity:0; transform:translate(139px,-57px) scale(0); z-index:-1; } }
@keyframes collapse5 { 0% { opacity:1; transform:translate(150px,0) scale(1); z-index:1; } 100% { opacity:0; transform:translate(150px,0) scale(0); z-index:-1; } }

.circular-menu svg { width: 24px; height: 24px; fill: currentColor; }
</style>
</head>

<script>
// ============================================================
// ===== صداها با Web Audio API =====
// ============================================================
let audioCtx = null;

function getAudioContext() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    return audioCtx;
}

function playTone(freq, duration, type = 'sine', vol = 0.3, delay = 0) {
    try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
        gain.gain.setValueAtTime(vol, ctx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + delay);
        osc.stop(ctx.currentTime + delay + duration);
    } catch (e) { /* ignore */ }
}

function sfxCorrect() {
    playTone(523, 0.15, 'sine', 0.25);
    setTimeout(() => playTone(659, 0.15, 'sine', 0.25), 150);
    setTimeout(() => playTone(784, 0.25, 'sine', 0.3), 300);
}

function sfxWrong() {
    playTone(200, 0.4, 'sawtooth', 0.25);
}

function sfxGameOver() {
    playTone(392, 0.3, 'sine', 0.25);
    setTimeout(() => playTone(311, 0.3, 'sine', 0.25), 300);
    setTimeout(() => playTone(246, 0.4, 'sine', 0.3), 600);
}

// ============================================================
// ===== کانفتی =====
// ============================================================
function launchConfetti(count = 50) {
    const container = document.getElementById('confettiContainer');
    const colors = ['#ff0', '#f0f', '#0ff', '#f00', '#0f0', '#00f', '#ffa500', '#ff69b4', '#ffd700', '#00e5ff'];
    for (let i = 0; i < count; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti';
        const size = Math.random() * 10 + 4;
        const left = Math.random() * 100;
        const delay = Math.random() * 1.2;
        const duration = Math.random() * 1.8 + 1.5;
        const color = colors[Math.floor(Math.random() * colors.length)];
        const shapes = ['50%', '0', '50% 0'];
        const borderRadius = shapes[Math.floor(Math.random() * shapes.length)];
        Object.assign(piece.style, {
            left: left + '%',
            width: size + 'px',
            height: size * (Math.random() * 0.6 + 0.4) + 'px',
            background: color,
            animationDuration: duration + 's',
            animationDelay: delay + 's',
            borderRadius: borderRadius
        });
        container.appendChild(piece);
    }
    setTimeout(() => {
        container.innerHTML = '';
    }, 4000);
}

// ============================================================
// ===== منطق بازی =====
// ============================================================
const canvas = document.getElementById('shapeCanvas');
const ctx = canvas.getContext('2d');

const SHAPE_WIDTH = 300;
const SHAPE_HEIGHT = 210;

let currentShape = null, currentAnswer = 0, timeLeft = 120, lives = 3, score = 0, timerInterval;

function getRandomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function updateLivesDisplay() {
    document.getElementById('livesBox').textContent = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(3 - Math.max(0, lives));
}

function showCorrectEffect() {
    const canvasEl = document.getElementById('shapeCanvas');
    canvasEl.classList.add('correct-flash');
    setTimeout(() => canvasEl.classList.remove('correct-flash'), 600);
}

function showCorrectPopup() {
    const container = document.getElementById('gameContainer');
    const popup = document.createElement('div');
    popup.className = 'correct-popup';
    popup.textContent = '✅';
    container.appendChild(popup);
    setTimeout(() => popup.remove(), 1000);
}

function showWrongEffect() {
    const overlay = document.getElementById('wrongOverlay');
    const input = document.getElementById('areaInput');
    overlay.classList.add('show');
    input.classList.add('shake');
    const canvasEl = document.getElementById('shapeCanvas');
    canvasEl.classList.add('wrong-flash');
    setTimeout(() => {
        overlay.classList.remove('show');
        input.classList.remove('shake');
        canvasEl.classList.remove('wrong-flash');
    }, 1000);
}

// ===== تولید شکل =====
function generateShape() {
    if (lives <= 0 || timeLeft <= 0) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const shapes = ['مربع', 'مستطیل', 'مثلث', 'متوازی‌الاضلاع', 'لوزی', 'ذوزنقه'];
    currentShape = shapes[getRandomInt(0, shapes.length - 1)];
    ctx.lineWidth = 3;

    ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 2;

    const centerX = canvas.width / 2, centerY = canvas.height / 2;
    let infoText = "";

    switch (currentShape) {
        case 'مربع': {
            let side = getRandomInt(2, 12);
            let grad = ctx.createLinearGradient(
                centerX - SHAPE_HEIGHT / 2, centerY - SHAPE_HEIGHT / 2,
                centerX + SHAPE_HEIGHT / 2, centerY + SHAPE_HEIGHT / 2
            );
            grad.addColorStop(0, '#ff7675');
            grad.addColorStop(1, '#e84393');
            ctx.fillStyle = grad;
            ctx.strokeStyle = '#d63031';
            ctx.fillRect(centerX - SHAPE_HEIGHT / 2, centerY - SHAPE_HEIGHT / 2, SHAPE_HEIGHT, SHAPE_HEIGHT);
            ctx.strokeRect(centerX - SHAPE_HEIGHT / 2, centerY - SHAPE_HEIGHT / 2, SHAPE_HEIGHT, SHAPE_HEIGHT);
            currentAnswer = side * side;
            infoText = `ضلع: ${side}`;
            break;
        }
        case 'مستطیل': {
            let length, width;
            do {
                length = getRandomInt(2, 12);
                width = getRandomInt(2, 12);
            } while (length === width);
            let grad = ctx.createLinearGradient(
                centerX - SHAPE_WIDTH / 2, centerY - SHAPE_HEIGHT / 2,
                centerX + SHAPE_WIDTH / 2, centerY + SHAPE_HEIGHT / 2
            );
            grad.addColorStop(0, '#74b9ff');
            grad.addColorStop(1, '#0984e3');
            ctx.fillStyle = grad;
            ctx.strokeStyle = '#0652DD';
            ctx.fillRect(centerX - SHAPE_WIDTH / 2, centerY - SHAPE_HEIGHT / 2, SHAPE_WIDTH, SHAPE_HEIGHT);
            ctx.strokeRect(centerX - SHAPE_WIDTH / 2, centerY - SHAPE_HEIGHT / 2, SHAPE_WIDTH, SHAPE_HEIGHT);
            currentAnswer = length * width;
            infoText = `طول: ${length}, عرض: ${width}`;
            break;
        }
        case 'مثلث': {
            let base, height;
            do {
                base = getRandomInt(2, 12);
                height = getRandomInt(2, 12);
            } while ((base * height) % 2 !== 0);
            let grad = ctx.createLinearGradient(
                centerX, centerY - SHAPE_HEIGHT / 2,
                centerX, centerY + SHAPE_HEIGHT / 2
            );
            grad.addColorStop(0, '#55efc4');
            grad.addColorStop(1, '#00b894');
            ctx.fillStyle = grad;
            ctx.strokeStyle = '#00a085';
            ctx.beginPath();
            ctx.moveTo(centerX - SHAPE_WIDTH / 2, centerY + SHAPE_HEIGHT / 2);
            ctx.lineTo(centerX + SHAPE_WIDTH / 2, centerY + SHAPE_HEIGHT / 2);
            ctx.lineTo(centerX, centerY - SHAPE_HEIGHT / 2);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            currentAnswer = (base * height) / 2;
            infoText = `قاعده: ${base}, ارتفاع: ${height}`;
            break;
        }
        case 'متوازی‌الاضلاع': {
            let paraBase = getRandomInt(2, 12);
            let paraHeight = getRandomInt(2, 12);
            let grad = ctx.createLinearGradient(
                centerX - SHAPE_WIDTH / 2 - 30, centerY - SHAPE_HEIGHT / 2,
                centerX + SHAPE_WIDTH / 2 + 30, centerY + SHAPE_HEIGHT / 2
            );
            grad.addColorStop(0, '#ffeaa7');
            grad.addColorStop(1, '#fdcb6e');
            ctx.fillStyle = grad;
            ctx.strokeStyle = '#e17055';
            ctx.beginPath();
            const offset = 30;
            ctx.moveTo(centerX - SHAPE_WIDTH / 2 + offset, centerY - SHAPE_HEIGHT / 2);
            ctx.lineTo(centerX + SHAPE_WIDTH / 2 + offset, centerY - SHAPE_HEIGHT / 2);
            ctx.lineTo(centerX + SHAPE_WIDTH / 2 - offset, centerY + SHAPE_HEIGHT / 2);
            ctx.lineTo(centerX - SHAPE_WIDTH / 2 - offset, centerY + SHAPE_HEIGHT / 2);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            currentAnswer = paraBase * paraHeight;
            infoText = `قاعده: ${paraBase}, ارتفاع: ${paraHeight}`;
            break;
        }
        case 'لوزی': {
            let d1, d2;
            do {
                d1 = getRandomInt(2, 12);
                d2 = getRandomInt(2, 12);
            } while ((d1 * d2) % 2 !== 0);
            let grad = ctx.createRadialGradient(
                centerX, centerY, 0,
                centerX, centerY, SHAPE_WIDTH / 2
            );
            grad.addColorStop(0, '#a29bfe');
            grad.addColorStop(1, '#6c5ce7');
            ctx.fillStyle = grad;
            ctx.strokeStyle = '#4834d4';
            ctx.beginPath();
            ctx.moveTo(centerX, centerY - SHAPE_HEIGHT / 2);
            ctx.lineTo(centerX + SHAPE_WIDTH / 2, centerY);
            ctx.lineTo(centerX, centerY + SHAPE_HEIGHT / 2);
            ctx.lineTo(centerX - SHAPE_WIDTH / 2, centerY);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            currentAnswer = (d1 * d2) / 2;
            infoText = `قطر افقی: ${d1}, قطر عمودی: ${d2}`;
            break;
        }
        case 'ذوزنقه': {
            let topBase, bottomBase, trapHeight;
            do {
                topBase = getRandomInt(2, 12);
                bottomBase = getRandomInt(2, 12);
                trapHeight = getRandomInt(2, 12);
            } while (
                topBase === bottomBase ||
                ((topBase + bottomBase) * trapHeight) % 2 !== 0
            );
            let grad = ctx.createLinearGradient(
                centerX, centerY - SHAPE_HEIGHT / 2,
                centerX, centerY + SHAPE_HEIGHT / 2
            );
            grad.addColorStop(0, '#fd79a8');
            grad.addColorStop(1, '#e84393');
            ctx.fillStyle = grad;
            ctx.strokeStyle = '#c44569';
            ctx.beginPath();
            ctx.moveTo(centerX - bottomBase * 10 / 2, centerY - SHAPE_HEIGHT / 2);
            ctx.lineTo(centerX - bottomBase * 10 / 2 + topBase * 10, centerY - SHAPE_HEIGHT / 2);
            ctx.lineTo(centerX + bottomBase * 10 / 2, centerY + SHAPE_HEIGHT / 2);
            ctx.lineTo(centerX - bottomBase * 10 / 2, centerY + SHAPE_HEIGHT / 2);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            currentAnswer = ((topBase + bottomBase) * trapHeight) / 2;
            infoText = `قاعده بالا: ${topBase}, قاعده پایین: ${bottomBase}, ارتفاع: ${trapHeight}`;
            break;
        }
    }

    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;

    // ===== فونت داخل شکل بسیار بزرگ و خوانا =====
    let fontSize = 85;
    if (currentShape.length > 6) fontSize = 70;
    if (currentShape.length > 8) fontSize = 60;
    
    const maxWidth = SHAPE_WIDTH * 0.85;
    ctx.font = `bold ${fontSize}px Baloo 2`;
    let metrics = ctx.measureText(currentShape);
    while (metrics.width > maxWidth && fontSize > 30) {
        fontSize -= 5;
        ctx.font = `bold ${fontSize}px Baloo 2`;
        metrics = ctx.measureText(currentShape);
    }

    ctx.fillStyle = 'white';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 8;
    ctx.fillText(currentShape, centerX, centerY);

    document.getElementById('info').textContent = infoText;
    document.getElementById('areaInput').value = '';
    document.getElementById('result').textContent = '';
    document.getElementById('areaInput').focus();
}

// ===== بررسی پاسخ =====
function checkAnswer() {
    if (lives <= 0 || timeLeft <= 0) return;
    const userAnswer = parseInt(document.getElementById('areaInput').value);
    const resultEl = document.getElementById('result');
    if (isNaN(userAnswer)) {
        resultEl.textContent = 'لطفاً یک عدد وارد کنید!';
        resultEl.style.color = '#e74c3c';
        resultEl.style.background = '#ffeaea';
        return;
    }
    if (userAnswer === currentAnswer) {
        score++;
        document.getElementById('score').textContent = score;
        resultEl.textContent = '🎉 جواب درست!';
        resultEl.style.color = '#27ae60';
        resultEl.style.background = '#e8f8ef';
        sfxCorrect();
        showCorrectEffect();
        showCorrectPopup();
        launchConfetti(50);
    } else {
        lives--;
        updateLivesDisplay();
        resultEl.textContent = `❌ جواب اشتباه! جواب صحیح: ${currentAnswer}`;
        resultEl.style.color = '#e74c3c';
        resultEl.style.background = '#ffeaea';
        sfxWrong();
        showWrongEffect();
        if (lives <= 0) endGame();
    }
    setTimeout(generateShape, 800);
}

// ===== پایان بازی =====
function endGame() {
    clearInterval(timerInterval);
    sfxGameOver();
    document.getElementById('result').textContent = `⏰ بازی تمام شد! امتیاز شما: ${score}`;
    document.getElementById('result').style.color = '#34495e';
    document.getElementById('result').style.background = '#f8f9fa';
    document.getElementById('restartBtn').style.display = 'inline-block';
    document.getElementById('areaInput').disabled = true;
}

// ===== شروع مجدد =====
function restartGame() {
    lives = 3;
    timeLeft = 120;
    score = 0;
    updateLivesDisplay();
    document.getElementById('timer').textContent = timeLeft;
    document.getElementById('score').textContent = score;
    document.getElementById('restartBtn').style.display = 'none';
    document.getElementById('result').textContent = '';
    document.getElementById('areaInput').disabled = false;
    document.getElementById('confettiContainer').innerHTML = '';
    generateShape();
    startTimer();
}

// ===== تایمر =====
function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').textContent = timeLeft;
        if (timeLeft <= 0) endGame();
    }, 1000);
}

// ===== رویدادها =====
document.getElementById('areaInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') checkAnswer();
});

// ===== شروع =====
updateLivesDisplay();
generateShape();
startTimer();

// ===== اسکریپت منوی شبکه‌های اجتماعی =====
(function() {
    const menu = document.getElementById('circularMenu');
    const menuButton = document.querySelector('.menu-button');
    const menuItems = Array.from(document.querySelectorAll('.menu-item'));
    let isMenuOpen = false;
    let isInitialized = false;
    let isAnimating = false;
    const ANIMATION_LOCK_MS = 730;

    function setMenuState(open) {
        isMenuOpen = open;
        menu.classList.toggle('active', open);
        menuButton.setAttribute('aria-expanded', String(open));
        menuItems.forEach(item => item.setAttribute('tabindex', open ? '0' : '-1'));
    }

    function toggleMenu() {
        if (isAnimating) return;
        if (!isInitialized) {
            menu.classList.add('ready');
            isInitialized = true;
        }
        isAnimating = true;
        setMenuState(!isMenuOpen);
        setTimeout(() => { isAnimating = false; }, ANIMATION_LOCK_MS);
    }

    menuButton.addEventListener('click', function(e) {
        e.stopPropagation();
        toggleMenu();
    });

    document.addEventListener('click', function(e) {
        if (isMenuOpen && !menu.contains(e.target)) {
            setMenuState(false);
        }
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && isMenuOpen) {
            setMenuState(false);
            menuButton.focus();
        }
    });

    menu.addEventListener('click', function(e) {
        e.stopPropagation();
    });
})();
</script>
